<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InnerSource on GitHub — 60 MCQs</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161b27;
    --card: #1c2333;
    --border: #2a3347;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --accent3: #f78166;
    --text: #e6edf3;
    --muted: #8b949e;
    --correct: #1a3a2a;
    --correct-border: #3fb950;
    --wrong: #3a1a1a;
    --wrong-border: #f78166;
    --highlight: rgba(88,166,255,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 0;
  }

  /* HERO */
  .hero {
    background: linear-gradient(135deg, #0d0f14 0%, #161b27 50%, #0d1117 100%);
    border-bottom: 1px solid var(--border);
    padding: 48px 24px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(88,166,255,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-badge {
    display: inline-block;
    background: rgba(88,166,255,0.1);
    border: 1px solid rgba(88,166,255,0.3);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 20px;
  }
  .hero h1 {
    font-size: clamp(28px, 5vw, 52px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #e6edf3 0%, #58a6ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  .hero p {
    color: var(--muted);
    font-size: 15px;
    font-family: 'Space Mono', monospace;
  }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
    padding: 20px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    text-align: center;
  }
  .stat-num {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    display: block;
  }
  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* CONTROLS */
  .controls {
    max-width: 900px;
    margin: 28px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }
  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: var(--accent);
    color: #0d0f14;
  }
  .btn-primary:hover { background: #79b8ff; transform: translateY(-1px); }
  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger {
    background: transparent;
    color: var(--accent3);
    border: 1px solid var(--accent3);
  }
  .btn-danger:hover { background: var(--accent3); color: #fff; }

  .filter-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn.active, .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(88,166,255,0.08);
  }

  /* MAIN */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 24px 60px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* QUESTION CARD */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
    animation: fadeIn 0.3s ease both;
  }
  .q-card:hover { border-color: #2d3f5a; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 20px 22px 16px;
  }
  .q-num {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    background: rgba(88,166,255,0.12);
    border: 1px solid rgba(88,166,255,0.25);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin-top: 2px;
  }
  .q-text {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.55;
    color: var(--text);
    flex: 1;
  }
  .q-category {
    flex-shrink: 0;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid;
  }

  .options {
    padding: 0 22px 16px 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.18s;
    background: var(--surface);
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    text-align: left;
    width: 100%;
    font-family: 'Syne', sans-serif;
  }
  .option:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--highlight);
  }
  .option-letter {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: rgba(139,148,158,0.12);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    margin-top: 1px;
    transition: all 0.18s;
  }
  .option.correct {
    background: var(--correct);
    border-color: var(--correct-border);
  }
  .option.correct .option-letter {
    background: var(--correct-border);
    color: #fff;
    border-color: var(--correct-border);
  }
  .option.wrong {
    background: var(--wrong);
    border-color: var(--wrong-border);
  }
  .option.wrong .option-letter {
    background: var(--wrong-border);
    color: #fff;
    border-color: var(--wrong-border);
  }
  .option:disabled { cursor: default; }

  .answer-reveal {
    margin: 0 22px 18px;
    padding: 12px 16px;
    background: rgba(63,185,80,0.08);
    border: 1px solid rgba(63,185,80,0.2);
    border-radius: 8px;
    font-size: 13px;
    color: var(--accent2);
    font-family: 'Space Mono', monospace;
    display: none;
    line-height: 1.6;
  }
  .answer-reveal.show { display: block; }
  .answer-reveal strong { color: #3fb950; }

  /* SCORE PANEL */
  #score-panel {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 999;
    min-width: 140px;
  }
  #score-panel .sp-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #score-panel .sp-val {
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent2);
  }

  /* CATEGORY COLORS */
  .cat-concepts { color: #58a6ff; border-color: rgba(88,166,255,0.3); }
  .cat-visibility { color: #d2a8ff; border-color: rgba(210,168,255,0.3); }
  .cat-permissions { color: #3fb950; border-color: rgba(63,185,80,0.3); }
  .cat-documentation { color: #ffa657; border-color: rgba(255,166,87,0.3); }
  .cat-workflows { color: #f78166; border-color: rgba(247,129,102,0.3); }
  .cat-metrics { color: #79c0ff; border-color: rgba(121,192,255,0.3); }

  .progress-bar {
    height: 3px;
    background: var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s ease;
  }

  @media(max-width:600px) {
    .stats-bar { gap: 20px; }
    .hero { padding: 36px 16px 28px; }
    #score-panel { bottom: 12px; right: 12px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">Quiz · 60 Questions</div>
  <h1>InnerSource on GitHub</h1>
  <p>Concepts, Visibility, Permissions, and Metrics</p>
</div>

<div class="stats-bar">
  <div class="stat"><span class="stat-num" id="total-count">60</span><span class="stat-label">Questions</span></div>
  <div class="stat"><span class="stat-num" id="answered-count">0</span><span class="stat-label">Answered</span></div>
  <div class="stat"><span class="stat-num" id="correct-count" style="color:var(--accent2)">0</span><span class="stat-label">Correct</span></div>
  <div class="stat"><span class="stat-num" id="score-pct" style="color:var(--accent)">0%</span><span class="stat-label">Score</span></div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

<div class="controls">
  <div class="filter-group">
    <button class="filter-btn active" onclick="filterCat('all',this)">All</button>
    <button class="filter-btn" onclick="filterCat('Concepts',this)">Concepts</button>
    <button class="filter-btn" onclick="filterCat('Visibility',this)">Visibility</button>
    <button class="filter-btn" onclick="filterCat('Permissions',this)">Permissions</button>
    <button class="filter-btn" onclick="filterCat('Documentation',this)">Documentation</button>
    <button class="filter-btn" onclick="filterCat('Workflows',this)">Workflows</button>
    <button class="filter-btn" onclick="filterCat('Metrics',this)">Metrics</button>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn btn-secondary" onclick="revealAll()">Show All Answers</button>
    <button class="btn btn-danger" onclick="resetAll()">Reset</button>
  </div>
</div>

<main id="quiz-container"></main>

<div id="score-panel">
  <span class="sp-label">Live Score</span>
  <span class="sp-val" id="score-live">0 / 0</span>
</div>

<script>
const questions = [
  // ── CONCEPTS ────────────────────────────────────────────────
  { cat: "Concepts", q: "What is InnerSource described as in the text?", opts: ["A closed-source proprietary software model", "The practice of applying open-source patterns to projects with a limited audience", "A completely public open-source program", "A hardware development lifecycle"], ans: 1, exp: "InnerSource is the practice of applying open-source patterns to projects with a limited audience." },
  { cat: "Concepts", q: "In an InnerSource program, who typically has access to the project?", opts: ["Anyone on the internet", "Only the CEO and managers", "Only the employees of that company", "Only external contractors"], ans: 2, exp: "A company might establish an InnerSource program... except that it's only accessible to the employees of that company." },
  { cat: "Concepts", q: "InnerSource is effectively an open-source program behind what?", opts: ["A paywall", "A hardware load balancer", "Your company's firewall", "A public domain license"], ans: 2, exp: "In effect, it's an open-source program behind your company's firewall." },
  { cat: "Concepts", q: "Which of the following is NOT listed as a core benefit of InnerSource?", opts: ["Supporting internal visibility", "Reducing friction", "Eliminating all software bugs permanently", "Standardizing practices"], ans: 2, exp: "The text lists three main benefits: support internal visibility, reduce friction, and standardize practices." },
  { cat: "Concepts", q: "How does supporting internal visibility help developers?", opts: ["It prevents them from seeing code from other teams", "It lets them see how different teams solve similar problems and find reusable code", "It automatically writes code for them", "It hides project velocity and direction"], ans: 1, exp: "They can see how different teams solve problems similar to the ones they're facing, and often find code and other assets that they can reuse." },
  { cat: "Concepts", q: "If a consumer team needs a bug fix from a different team's project, what channel does InnerSource provide?", opts: ["They must wait indefinitely for the owning team", "They can propose the changes they need via pull request", "They must rewrite the entire project from scratch", "They are forbidden from asking for changes"], ans: 1, exp: "In an InnerSource program, they have a channel through which they can propose the changes they need." },
  { cat: "Concepts", q: "What option does a consumer team have if their proposed changes cannot be merged into the parent project?", opts: ["Forking the project to meet their needs", "Deleting the parent project", "Filing a lawsuit against the owning team", "Abandoning their own project"], ans: 0, exp: "And if those changes can't be merged in for any reason, the consumer team has the option of forking the project to meet their needs." },
  { cat: "Concepts", q: "How does building an InnerSource program help standardize practices?", opts: ["It forces every team to write code in the exact same language", "It provides a great opportunity to adopt standard conventions that can be used across every development team", "It prevents teams from communicating", "It removes the need for any processes"], ans: 1, exp: "Building an InnerSource program is a great opportunity to adopt standard conventions that can be used across every development team..." },
  { cat: "Concepts", q: "Even if teams don't follow identical practices, standardizing HOW they communicate their different processes makes it easier to do what?", opts: ["Ignore contributions", "Contribute to either team's project", "Keep projects completely isolated", "Delete documentation"], ans: 1, exp: "Having them standardize on the way they communicate their different processes makes it much easier for anyone to contribute to either." },
  { cat: "Concepts", q: "Which GitHub tools are recommended as a tip to further support InnerSource collaboration?", opts: ["GitHub Copilot and Actions", "GitHub Discussions and GitHub Projects", "GitHub Pages and Wikis", "GitHub Sponsors and Packages"], ans: 1, exp: "Tip: Consider using GitHub Discussions and GitHub Projects to further support InnerSource collaboration across teams." },

  // ── VISIBILITY ─────────────────────────────────────────────────
  { cat: "Visibility", q: "How many levels of repository visibility can you configure on GitHub according to the text?", opts: ["Two", "Three", "Four", "Five"], ans: 1, exp: "You can configure GitHub repositories with three levels of visibility." },
  { cat: "Visibility", q: "What does a user see if they try to access a repository without meeting the visibility requirement?", opts: ["A login prompt", "The source code in read-only mode", "A 'not found' page", "An 'access denied' popup"], ans: 2, exp: "Users who don't meet the visibility requirement see 'not found' pages when they try to access your repository." },
  { cat: "Visibility", q: "Which repository visibility level is visible to everyone inside and outside the organization?", opts: ["Public", "Internal", "Private", "Protected"], ans: 0, exp: "Public repositories are visible to everyone. Use this visibility for projects that are truly open source..." },
  { cat: "Visibility", q: "Internal repositories are only visible to whom?", opts: ["Everyone on GitHub", "Members of the enterprise that owns them", "Only the repository creator", "External contractors only"], ans: 1, exp: "Internal repositories are only visible to members of the enterprise that owns them." },
  { cat: "Visibility", q: "Which GitHub customer tier is required to use the 'Internal' repository visibility?", opts: ["GitHub Free", "GitHub Pro", "GitHub Team", "GitHub Enterprise"], ans: 3, exp: "Note: Internal repositories are only available to GitHub Enterprise customers." },
  { cat: "Visibility", q: "Which visibility level is explicitly recommended for InnerSource projects?", opts: ["Public", "Internal", "Private", "Archived"], ans: 1, exp: "Use this visibility [Internal] for InnerSource projects." },
  { cat: "Visibility", q: "Private repositories are visible to whom?", opts: ["Only the owner and any teams or individuals they add", "All members of the enterprise", "Everyone on the internet", "Only GitHub administrators"], ans: 0, exp: "Private repositories are only visible to the owner and any teams or individuals they add." },
  { cat: "Visibility", q: "When should you use 'Private' visibility?", opts: ["For truly open source projects", "For InnerSource projects intended for the whole company", "For projects that only specific users and groups should have access to", "To make a repository easily discoverable on Google"], ans: 2, exp: "Use this visibility for projects that only specific users and groups should have access to." },

  // ── PERMISSIONS ────────────────────────────────────────────────
  { cat: "Permissions", q: "How many permission levels can be configured on an individual or team basis on GitHub?", opts: ["Three", "Four", "Five", "Six"], ans: 2, exp: "There are five permission levels:" },
  { cat: "Permissions", q: "Which permission level is recommended for noncode contributors who want to view or discuss the project?", opts: ["Triage", "Read", "Write", "Maintain"], ans: 1, exp: "Read level is recommended for noncode contributors who want to view or discuss the project." },
  { cat: "Permissions", q: "Which permission level is recommended for contributors who proactively manage issues/PRs but do NOT need write access?", opts: ["Read", "Triage", "Maintain", "Admin"], ans: 1, exp: "Triage level is recommended for contributors who need to proactively manage issues and pull requests without write access." },
  { cat: "Permissions", q: "Which permission level is recommended for contributors who actively push code to the project?", opts: ["Triage", "Maintain", "Write", "Admin"], ans: 2, exp: "Write level is recommended for contributors who actively push to the project." },
  { cat: "Permissions", q: "Which permission level is for project managers who need to manage the repository WITHOUT access to sensitive/destructive actions?", opts: ["Admin", "Write", "Maintain", "Triage"], ans: 2, exp: "Maintain level is recommended for project managers who need to manage the repository without access to sensitive or destructive actions." },
  { cat: "Permissions", q: "Which permission level provides full access, including sensitive and destructive actions like deleting a repository?", opts: ["Maintain", "Admin", "Owner", "Superuser"], ans: 1, exp: "Admin level is recommended for people who need full access to the project, including sensitive and destructive actions like managing security or deleting a repository." },
  { cat: "Permissions", q: "Managing security settings requires which permission level?", opts: ["Maintain", "Admin", "Write", "Triage"], ans: 1, exp: "Admin level... including sensitive and destructive actions like managing security..." },

  // ── DOCUMENTATION (Discoverability & README) ───────────────────────────────────────────────
  { cat: "Documentation", q: "As an InnerSource program grows, what is likely to become a challenge?", opts: ["Writing enough code", "Finding developers", "Efficiently finding content (discoverability)", "Paying for server costs"], ans: 2, exp: "While it's great to have all these assets available to the organization, it can become a challenge to efficiently find content." },
  { cat: "Documentation", q: "Which of the following is an example of a descriptive repository name mentioned in the text?", opts: ["repo-1", "test-project", "supply-chain-web", "my-app"], ans: 2, exp: "Use a descriptive repository name, such as warehouse-api or supply-chain-web." },
  { cat: "Documentation", q: "How long should a concise repository description be to let potential users know if it fits their needs?", opts: ["A full page", "A sentence or two", "A single word", "A detailed paragraph"], ans: 1, exp: "A sentence or two should be enough for potential users to know if the project might fit their needs." },
  { cat: "Documentation", q: "Why is licensing your repository important for discoverability and usage?", opts: ["It prevents anyone from reading the code", "So customers know how they can use, change, and distribute the software", "To charge money for downloads", "To satisfy GitHub's terms of service automatically"], ans: 1, exp: "License your repository so that customers know how they can use, change, and distribute the software." },
  { cat: "Documentation", q: "What file does GitHub use as the landing page when people visit the repository?", opts: ["INDEX.html", "MAIN.md", "README.md", "START.txt"], ans: 2, exp: "Include a README.md file in the repository. GitHub uses this file as the landing page when people visit the repository." },
  { cat: "Documentation", q: "What is one purpose of the README file regarding dependencies?", opts: ["To hide them from the user", "To include references to projects you depend on, promoting the work of others", "To automatically install them", "To complain about broken dependencies"], ans: 1, exp: "Include references to the projects on which you depend. These references are a good way to promote the work of others." },
  { cat: "Documentation", q: "What format should be used in the README to guide readers through properly formatted content?", opts: ["HTML", "XML", "Markdown", "Plain text"], ans: 2, exp: "Use Markdown to guide readers through properly formatted content." },
  { cat: "Documentation", q: "If multiple README files exist, which directory's README takes the highest priority to be shown?", opts: ["The repository's root directory", "The docs directory", "The .github directory", "The src directory"], ans: 2, exp: "The file shown is chosen from locations in the following order: 1. The .github directory..." },
  { cat: "Documentation", q: "Which directory is the LAST in the priority order for GitHub to surface a README file?", opts: ["The root directory", "The .github directory", "The docs directory", "The public directory"], ans: 2, exp: "3. The docs directory." },
  { cat: "Documentation", q: "After launching a project, what does the text suggest using to promote it and boost participation?", opts: ["Paid advertisements", "Email and other networking channels", "Physical flyers", "Automated spam bots"], ans: 1, exp: "Once the project launches, use email and other networking channels to promote it." },

  // ── DOCUMENTATION (CONTRIBUTING, CODEOWNERS, Templates) ───────────────────────────────────────────────
  { cat: "Documentation", q: "As projects gain traction, what might require a significant amount of work?", opts: ["Deleting old code", "Managing the expectations of project participants", "Updating the license daily", "Migrating to SVN"], ans: 1, exp: "Depending on the project, a significant amount of work might be required just to manage the expectations of project participants." },
  { cat: "Documentation", q: "Which file is used to explain the contribution policy for the project?", opts: ["README.md", "LICENSE", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md"], ans: 2, exp: "Use this file [CONTRIBUTING.md] to explain the contribution policy for the project." },
  { cat: "Documentation", q: "What happens on GitHub if a CONTRIBUTING.md file exists in a repository?", opts: ["Users are blocked from creating issues", "GitHub automatically merges pull requests", "GitHub presents a link to it when users create issues or PRs to encourage them to follow it", "The repository is made public"], ans: 2, exp: "If a CONTRIBUTING.md exists, GitHub presents a link to it when users create issues or pull requests to encourage them to follow it." },
  { cat: "Documentation", q: "What is the purpose of adding a CODEOWNERS file to a repository?", opts: ["To copyright the code", "To define individuals or teams responsible for reviewing code modifications", "To list the executives of the company", "To prevent anyone from forking the repo"], ans: 1, exp: "Additionally, consider adding a CODEOWNERS file to the repository to define individuals or teams that are responsible for reviewing code modifications." },
  { cat: "Documentation", q: "What do starter templates for issues and pull requests provide?", opts: ["Automatic bug fixes", "The initial description text for a newly created issue or pull request", "A compiled version of the code", "A graphical user interface designer"], ans: 1, exp: "Use these templates to provide the initial description text for a newly created issue or pull request." },
  { cat: "Documentation", q: "In which directory should you place an issue template (e.g., ISSUE_TEMPLATE.md)?", opts: ["/docs", "/templates", "/.github", "/src"], ans: 2, exp: "For example, if your project has .github/ISSUE_TEMPLATE.md..." },
  { cat: "Documentation", q: "What is the benefit of using an issue template rather than just a CONTRIBUTING.md file?", opts: ["Users can fill out the issue like a form without constantly referencing the contributing guide", "It allows anonymous issues", "It bypasses the need for a title", "It automatically labels the issue as a bug"], ans: 0, exp: "Rather than having to constantly reference the required details from a CONTRIBUTING.md, they're able to just fill out the issue like a form using the template text." },

const catColorMap = { 
  "Concepts": "cat-concepts",
  "Visibility": "cat-visibility",
  "Permissions": "cat-permissions",
  "Documentation": "cat-documentation",
  "Workflows": "cat-workflows",
  "Metrics": "cat-metrics"
};

let answered = 0, correct = 0, currentFilter = 'all';

function renderAll() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  const filtered = currentFilter === 'all' ? questions : questions.filter(q => q.cat === currentFilter);
  filtered.forEach((q, idx) => {
    const globalIdx = questions.indexOf(q);
    container.appendChild(buildCard(q, globalIdx, idx + 1));
  });
}

function buildCard(q, globalIdx, displayNum) {
  const card = document.createElement('div');
  card.className = 'q-card';
  card.id = `q-${globalIdx}`;
  card.style.animationDelay = `${(displayNum - 1) * 0.03}s`;

  const catClass = catColorMap[q.cat] || 'cat-concepts';
  const letters = ['A','B','C','D'];

  card.innerHTML = `
    <div class="q-header">
      <div class="q-num">${String(displayNum).padStart(2,'0')}</div>
      <div class="q-text">${q.q}</div>
      <span class="q-category ${catClass}">${q.cat}</span>
    </div>
    <div class="options" id="opts-${globalIdx}">
      ${q.opts.map((opt, i) => `
        <button class="option" onclick="selectAnswer(${globalIdx},${i})" id="opt-${globalIdx}-${i}">
          <span class="option-letter">${letters[i]}</span>
          <span>${opt}</span>
        </button>`).join('')}
    </div>
    <div class="answer-reveal" id="exp-${globalIdx}">
      <strong>✓ Answer: ${letters[q.ans]}. ${q.opts[q.ans]}</strong><br>${q.exp}
    </div>`;
  return card;
}

function selectAnswer(qIdx, selectedIdx) {
  const q = questions[qIdx];
  const optsDivButtons = document.querySelectorAll(`#opts-${qIdx} .option`);
  const expDiv = document.getElementById(`exp-${qIdx}`);
  if (expDiv.classList.contains('show')) return;

  answered++;
  const isCorrect = selectedIdx === q.ans;
  if (isCorrect) correct++;

  optsDivButtons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('correct');
    else if (i === selectedIdx && !isCorrect) btn.classList.add('wrong');
  });

  expDiv.classList.add('show');
  updateStats();
}

function updateStats() {
  document.getElementById('answered-count').textContent = answered;
  document.getElementById('correct-count').textContent = correct;
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-live').textContent = `${correct} / ${answered}`;
  document.getElementById('progress-fill').style.width = `${(answered / questions.length) * 100}%`;
}

function revealAll() {
  questions.forEach((q, idx) => {
    const expDiv = document.getElementById(`exp-${idx}`);
    if (!expDiv) return;
    const optsBtns = document.querySelectorAll(`#opts-${idx} .option`);
    optsBtns.forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.ans) btn.classList.add('correct');
    });
    expDiv.classList.add('show');
  });
}

function resetAll() {
  answered = 0; correct = 0;
  updateStats();
  renderAll();
}

function filterCat(cat, el) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderAll();
}

renderAll();
</script>
