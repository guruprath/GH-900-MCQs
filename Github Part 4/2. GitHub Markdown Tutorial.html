<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Markdown Tutorial — 75 MCQs</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161b27;
    --card: #1c2333;
    --border: #2a3347;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --accent3: #f78166;
    --text: #e6edf3;
    --muted: #8b949e;
    --correct: #1a3a2a;
    --correct-border: #3fb950;
    --wrong: #3a1a1a;
    --wrong-border: #f78166;
    --highlight: rgba(88,166,255,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 0;
  }

  /* HERO */
  .hero {
    background: linear-gradient(135deg, #0d0f14 0%, #161b27 50%, #0d1117 100%);
    border-bottom: 1px solid var(--border);
    padding: 48px 24px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(88,166,255,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-badge {
    display: inline-block;
    background: rgba(88,166,255,0.1);
    border: 1px solid rgba(88,166,255,0.3);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 20px;
  }
  .hero h1 {
    font-size: clamp(28px, 5vw, 52px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #e6edf3 0%, #58a6ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  .hero p {
    color: var(--muted);
    font-size: 15px;
    font-family: 'Space Mono', monospace;
  }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
    padding: 20px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    text-align: center;
  }
  .stat-num {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    display: block;
  }
  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* CONTROLS */
  .controls {
    max-width: 900px;
    margin: 28px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }
  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: var(--accent);
    color: #0d0f14;
  }
  .btn-primary:hover { background: #79b8ff; transform: translateY(-1px); }
  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger {
    background: transparent;
    color: var(--accent3);
    border: 1px solid var(--accent3);
  }
  .btn-danger:hover { background: var(--accent3); color: #fff; }

  .filter-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn.active, .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(88,166,255,0.08);
  }

  /* MAIN */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 24px 60px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* QUESTION CARD */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
    animation: fadeIn 0.3s ease both;
  }
  .q-card:hover { border-color: #2d3f5a; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 20px 22px 16px;
  }
  .q-num {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    background: rgba(88,166,255,0.12);
    border: 1px solid rgba(88,166,255,0.25);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin-top: 2px;
  }
  .q-text {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.55;
    color: var(--text);
    flex: 1;
  }
  .q-category {
    flex-shrink: 0;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid;
  }

  .options {
    padding: 0 22px 16px 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.18s;
    background: var(--surface);
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    text-align: left;
    width: 100%;
    font-family: 'Syne', sans-serif;
  }
  .option:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--highlight);
  }
  .option-letter {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: rgba(139,148,158,0.12);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    margin-top: 1px;
    transition: all 0.18s;
  }
  .option.correct {
    background: var(--correct);
    border-color: var(--correct-border);
  }
  .option.correct .option-letter {
    background: var(--correct-border);
    color: #fff;
    border-color: var(--correct-border);
  }
  .option.wrong {
    background: var(--wrong);
    border-color: var(--wrong-border);
  }
  .option.wrong .option-letter {
    background: var(--wrong-border);
    color: #fff;
    border-color: var(--wrong-border);
  }
  .option:disabled { cursor: default; }

  .answer-reveal {
    margin: 0 22px 18px;
    padding: 12px 16px;
    background: rgba(63,185,80,0.08);
    border: 1px solid rgba(63,185,80,0.2);
    border-radius: 8px;
    font-size: 13px;
    color: var(--accent2);
    font-family: 'Space Mono', monospace;
    display: none;
    line-height: 1.6;
  }
  .answer-reveal.show { display: block; }
  .answer-reveal strong { color: #3fb950; }

  /* SCORE PANEL */
  #score-panel {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 999;
    min-width: 140px;
  }
  #score-panel .sp-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #score-panel .sp-val {
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent2);
  }

  /* CATEGORY COLORS */
  .cat-basics { color: #58a6ff; border-color: rgba(88,166,255,0.3); }
  .cat-headings { color: #d2a8ff; border-color: rgba(210,168,255,0.3); }
  .cat-lists { color: #3fb950; border-color: rgba(63,185,80,0.3); }
  .cat-code { color: #ffa657; border-color: rgba(255,166,87,0.3); }
  .cat-images { color: #f78166; border-color: rgba(247,129,102,0.3); }
  .cat-workflow { color: #79c0ff; border-color: rgba(121,192,255,0.3); }

  .progress-bar {
    height: 3px;
    background: var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s ease;
  }

  @media(max-width:600px) {
    .stats-bar { gap: 20px; }
    .hero { padding: 36px 16px 28px; }
    #score-panel { bottom: 12px; right: 12px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">Quiz · 75 Questions</div>
  <h1>GitHub Markdown Tutorial</h1>
  <p>Step-by-step Comprehensive Test</p>
</div>

<div class="stats-bar">
  <div class="stat"><span class="stat-num" id="total-count">75</span><span class="stat-label">Questions</span></div>
  <div class="stat"><span class="stat-num" id="answered-count">0</span><span class="stat-label">Answered</span></div>
  <div class="stat"><span class="stat-num" id="correct-count" style="color:var(--accent2)">0</span><span class="stat-label">Correct</span></div>
  <div class="stat"><span class="stat-num" id="score-pct" style="color:var(--accent)">0%</span><span class="stat-label">Score</span></div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

<div class="controls">
  <div class="filter-group">
    <button class="filter-btn active" onclick="filterCat('all',this)">All</button>
    <button class="filter-btn" onclick="filterCat('Basics',this)">Basics</button>
    <button class="filter-btn" onclick="filterCat('Headings',this)">Headings</button>
    <button class="filter-btn" onclick="filterCat('Lists',this)">Lists</button>
    <button class="filter-btn" onclick="filterCat('Code Blocks',this)">Code Blocks</button>
    <button class="filter-btn" onclick="filterCat('Images',this)">Images</button>
    <button class="filter-btn" onclick="filterCat('Workflow',this)">Workflow</button>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn btn-secondary" onclick="revealAll()">Show All Answers</button>
    <button class="btn btn-danger" onclick="resetAll()">Reset</button>
  </div>
</div>

<main id="quiz-container"></main>

<div id="score-panel">
  <span class="sp-label">Live Score</span>
  <span class="sp-val" id="score-live">0 / 0</span>
</div>

<script>
const questions = [
  // ── BASICS (1-9) ────────────────────────────────────────────────
  { cat: "Basics", q: "What is Markdown defined as in the text?", opts: ["A programming language", "A heavyweight database engine", "A lightweight syntax for communicating on GitHub", "An operating system extension"], ans: 2, exp: "Markdown is a lightweight syntax for communicating on GitHub." },
  { cat: "Basics", q: "Which of the following is NOT mentioned as a styling you can add with Markdown?", opts: ["Headings", "Lists", "Tables", "Macros"], ans: 3, exp: "The text states you can add a heading, lists, bold, italics, tables, and many other stylings, but macros are not mentioned." },
  { cat: "Basics", q: "Where can Markdown be used within the GitHub ecosystem?", opts: ["Only in README files", "Comments on issues, pull requests, and discussions", "Only in the command line interface", "Only within Javascript code"], ans: 1, exp: "You can use Markdown in most places around GitHub such as comments on issues, pull requests, and discussions." },
  { cat: "Basics", q: "What are the two file extensions mentioned for Markdown files?", opts: [".txt or .text", ".md or .markdown", ".htm or .html", ".js or .ts"], ans: 1, exp: "Markdown can be used in files with the .md or .markdown extension." },
  { cat: "Basics", q: "Markdown can be used in 'Snippets of text' in which GitHub feature?", opts: ["Gists", "Actions", "Workflows", "Packages"], ans: 0, exp: "Markdown can be used in Snippets of text in Gists." },
  { cat: "Workflow", q: "In the 'Create a markdown file' activity, what tab should be selected first?", opts: ["Issues tab", "Pull requests tab", "Code tab", "Settings tab"], ans: 2, exp: "In the top navigation, select the Code tab." },
  { cat: "Workflow", q: "What is the name of the new branch created in Step 1?", opts: ["main", "start-blog", "feature-markdown", "patch-1"], ans: 1, exp: "Create a new branch with the following name: start-blog." },
  { cat: "Workflow", q: "What button is clicked to create a new file in the GitHub interface?", opts: ["Commit changes", "New repository", "Add file", "Create branch"], ans: 2, exp: "Above the files list, click the Add file button and select Create new file." },
  { cat: "Workflow", q: "What is the file name used in the first activity?", opts: ["index.html", "README.md", "day-1.md", "blog.markdown"], ans: 2, exp: "Use the following file name: day-1.md." },

  // ── HEADINGS (10-21) ─────────────────────────────────────────────────
  { cat: "Headings", q: "How is a heading defined in the text?", opts: ["A special CSS class for styling", "A larger bit of text at the beginning of a section", "A bolded word inside a paragraph", "A hyperlink to another document"], ans: 1, exp: "A heading is a larger bit of text at the beginning of a section." },
  { cat: "Headings", q: "How many sizes of headings are available in Markdown?", opts: ["Three", "Four", "Five", "Six"], ans: 3, exp: "There are six sizes." },
  { cat: "Headings", q: "Which heading size is described as the largest?", opts: ["<h1>", "<h3>", "<h5>", "<h6>"], ans: 0, exp: "This is an <h1> heading, which is the largest." },
  { cat: "Headings", q: "Which heading size is described as the smallest?", opts: ["<h1>", "<h2>", "<h4>", "<h6>"], ans: 3, exp: "This is an <h6> heading, which is the smallest." },
  { cat: "Headings", q: "What character represents an <h1> heading?", opts: ["-", "*", "#", "="], ans: 2, exp: "The example '# This is an <h1> heading' shows a single hash is used." },
  { cat: "Headings", q: "What character sequence represents an <h2> heading?", opts: ["##", "==", "**", ">>"], ans: 0, exp: "The example '## This is an <h2> heading' shows two hashes are used." },
  { cat: "Headings", q: "What character sequence represents an <h6> heading?", opts: ["#6", "######", "<h6/>", "------"], ans: 1, exp: "The example '###### This is an <h6> heading' shows six hashes are used." },
  { cat: "Workflow", q: "What text is used for the level one heading in the activity?", opts: ["# My Blog", "# Daily Learning", "# Hello World", "## Morning Planning"], ans: 1, exp: "In the editor, on the first line use a level one heading to give the page a title: # Daily Learning." },
  { cat: "Workflow", q: "What are the names of the two level 2 headings added in Step 1?", opts: ["Morning Planning and Review", "Setup and Conclusion", "Introduction and Summary", "Task 1 and Task 2"], ans: 0, exp: "Add a couple level 2 headings... ## Morning Planning, ## Review." },
  { cat: "Workflow", q: "What toggle is used to view the rendered version of the text?", opts: ["Render toggle", "View toggle", "Preview toggle", "Display toggle"], ans: 2, exp: "Above the editor, click the Preview toggle to view the rendered version." },
  { cat: "Workflow", q: "Which button is used to save the markdown file in the activity?", opts: ["Save file", "Commit changes", "Publish post", "Merge branch"], ans: 1, exp: "In the top right, click the Commit changes button." },
  { cat: "Workflow", q: "Who reviews the work and prepares next steps according to the narrative?", opts: ["The repository owner", "GitHub Actions", "Mona", "The Admin"], ans: 2, exp: "Mona should be busy reviewing your work and preparing the next steps." },

  // ── LISTS (22-38) ────────────────────────────────────────────────
  { cat: "Lists", q: "How many types of common lists does Markdown support according to the text?", opts: ["Two", "Three", "Four", "Five"], ans: 1, exp: "Markdown supports 3 types of common lists." },
  { cat: "Lists", q: "What are the three types of common lists?", opts: ["Unordered, Ordered, and Task", "Numbered, Bulleted, and Alpha", "Primary, Secondary, and Tertiary", "Simple, Complex, and Nested"], ans: 0, exp: "They include: Unordered - Bulleted list, Ordered - Number list, Task - Checkbox list." },
  { cat: "Lists", q: "What type of list is an 'Unordered' list?", opts: ["Number list", "Checkbox list", "Bulleted list", "Dropdown list"], ans: 2, exp: "Unordered - Bulleted list." },
  { cat: "Lists", q: "What type of list is an 'Ordered' list?", opts: ["Bulleted list", "Checkbox list", "Dropdown list", "Number list"], ans: 3, exp: "Ordered - Number list." },
  { cat: "Lists", q: "What type of list is a 'Task' list?", opts: ["Checkbox list", "Bulleted list", "Number list", "Ordered list"], ans: 0, exp: "Task - Checkbox list." },
  { cat: "Lists", q: "Which characters can be used to create an unordered list?", opts: ["1, 2, or 3", "a, b, or c", "-, *, or +", "<, >, or ="], ans: 2, exp: "Each item is placed on its own line using a -, *, or + character." },
  { cat: "Lists", q: "How is a list changed to an ordered list?", opts: ["By using any number instead of the list character", "By using Roman numerals", "By adding a hashtag", "By wrapping it in HTML <ol> tags"], ans: 0, exp: "A list is changed to ordered by using any number instead of the list character." },
  { cat: "Lists", q: "What does the text say markdown automatically handles for ordered lists?", opts: ["The font size", "The line spacing", "The counting", "The indentation"], ans: 2, exp: "Notice how markdown automatically handles the counting." },
  { cat: "Lists", q: "What type of list extends the unordered list?", opts: ["Ordered list", "Nested list", "Task list", "Definition list"], ans: 2, exp: "A task list is extends the unordered list to use check boxes." },
  { cat: "Lists", q: "What syntax represents an incomplete task?", opts: ["[x]", "(-)", "[ ]", "{ }"], ans: 2, exp: "Add empty brackets [ ] for incomplete tasks." },
  { cat: "Lists", q: "What syntax represents a complete task?", opts: ["[v]", "(x)", "[ ]", "[x]"], ans: 3, exp: "Add filled brackets [x] for complete tasks." },
  { cat: "Lists", q: "What is explicitly required inside the brackets for an incomplete task?", opts: ["An empty space", "A dash", "A question mark", "Nothing, it must be completely empty like []"], ans: 0, exp: "Note: The empty required space for empty brackets." },
  { cat: "Lists", q: "Where can task syntax be used to convey progress, according to the tip?", opts: ["Only in README files", "Issues and pull requests", "Commit messages", "GitHub Profiles"], ans: 1, exp: "Tip: Issues and pull requests can use task syntax for conveying progress." },
  { cat: "Workflow", q: "Under which heading is the task list added in Step 2?", opts: ["Review", "Daily Learning", "Morning Planning", "Conclusion"], ans: 2, exp: "Add the following task list below morning planning level two heading." },
  { cat: "Workflow", q: "What is the first goal in the task list activity?", opts: ["Learn about GitHub Pages", "Convert my first blog post into an actual webpage", "Check out the github blog for topic ideas", "Write a Python script"], ans: 2, exp: "- [ ] Check out the [github blog](...) for topic ideas." },
  { cat: "Workflow", q: "What URL is associated with the 'GitHub Pages' task?", opts: ["https://github.blog/", "https://pages.github.com", "https://skills.github.com/#first-day-on-github", "https://help.github.com"], ans: 2, exp: "- [ ] Learn about [GitHub Pages](https://skills.github.com/#first-day-on-github)." },
  { cat: "Workflow", q: "What is the third goal in the task list activity?", opts: ["Push the code to production", "Convert my first blog post into an actual webpage", "Merge the pull request", "Add an image"], ans: 1, exp: "- [ ] Convert my first blog post into an actual webpage." },

  // ── CODE BLOCKS (39-53) ───────────────────────────────────────────────
  { cat: "Code Blocks", q: "In Step 3, code syntax highlighting is based on what?", opts: ["The user's theme settings", "The language", "The file size", "The indentation level"], ans: 1, exp: "Let's learn about code blocks and syntax highlighting based on the language." },
  { cat: "Code Blocks", q: "According to the tip in Step 3, what should you try testing out?", opts: ["Different browser settings", "Other file extension types", "Different keyboard shortcuts", "Light mode themes"], ans: 1, exp: "Try testing out some other file extension types!" },
  { cat: "Code Blocks", q: "In the terminal command example, what language identifier is specified?", opts: ["cmd", "powershell", "bash", "terminal"], ans: 2, exp: "Example: Terminal Command specifies ```bash." },
  { cat: "Code Blocks", q: "What is the URL used in the git clone example?", opts: ["[https://github.com/skills/markdown](https://github.com/skills/markdown)", "[https://github.com/skills/communicate-using-markdown](https://github.com/skills/communicate-using-markdown)", "[https://github.com/octocat/Spoon-Knife](https://github.com/octocat/Spoon-Knife)", "[https://github.blog/](https://github.blog/)"], ans: 1, exp: "git clone [https://github.com/skills/communicate-using-markdown](https://github.com/skills/communicate-using-markdown)." },
  { cat: "Code Blocks", q: "In the Javascript example, what language identifier is used?", opts: ["javascript", "java", "js", "ts"], ans: 2, exp: "Example: Javascript Code specifies ```js." },
  { cat: "Code Blocks", q: "In the Javascript example, what is the variable name?", opts: ["helloWorld", "myVar", "greeting", "output"], ans: 1, exp: "var myVar = \"Hello, world!\";" },
  { cat: "Code Blocks", q: "What string value is assigned in the Javascript example?", opts: ["Hello, GitHub!", "Hello, world!", "Testing 123", "Init"], ans: 1, exp: "var myVar = \"Hello, world!\";" },
  { cat: "Workflow", q: "Below which heading is the code snippet added in Step 3?", opts: ["Morning Planning", "Review", "Daily Learning", "Summary"], ans: 1, exp: "Below Review level two heading add the following entry." },
  { cat: "Workflow", q: "From where was the 'awesome code snippet' learned?", opts: ["Stack Overflow", "The GitHub Blog", "A tutorial video", "A coworker"], ans: 1, exp: "recording an awesome code snippet you just learned from the GitHub Blog." },
  { cat: "Code Blocks", q: "What does the code snippet in Step 3 do?", opts: ["Commits changes to git", "Downloads a repository", "Convert an image or video from dark mode to light mode", "Compresses a file"], ans: 2, exp: "Convert an image or video from dark mode to light mode using ffmpeg." },

const catColorMap = { "Basics":"cat-basics","Headings":"cat-headings","Lists":"cat-lists","Code Blocks":"cat-code","Images":"cat-images","Workflow":"cat-workflow" };

let answered = 0, correct = 0, currentFilter = 'all';

function renderAll() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  const filtered = currentFilter === 'all' ? questions : questions.filter(q => q.cat === currentFilter);
  filtered.forEach((q, idx) => {
    const globalIdx = questions.indexOf(q);
    container.appendChild(buildCard(q, globalIdx, idx + 1));
  });
}

function buildCard(q, globalIdx, displayNum) {
  const card = document.createElement('div');
  card.className = 'q-card';
  card.id = `q-${globalIdx}`;
  card.style.animationDelay = `${(displayNum - 1) * 0.03}s`;

  const catClass = catColorMap[q.cat] || 'cat-basics';
  const letters = ['A','B','C','D'];

  card.innerHTML = `
    <div class="q-header">
      <div class="q-num">${String(displayNum).padStart(2,'0')}</div>
      <div class="q-text">${q.q}</div>
      <span class="q-category ${catClass}">${q.cat}</span>
    </div>
    <div class="options" id="opts-${globalIdx}">
      ${q.opts.map((opt, i) => `
        <button class="option" onclick="selectAnswer(${globalIdx},${i})" id="opt-${globalIdx}-${i}">
          <span class="option-letter">${letters[i]}</span>
          <span>${opt}</span>
        </button>`).join('')}
    </div>
    <div class="answer-reveal" id="exp-${globalIdx}">
      <strong>✓ Answer: ${letters[q.ans]}. ${q.opts[q.ans]}</strong><br>${q.exp}
    </div>`;
  return card;
}

function selectAnswer(qIdx, selectedIdx) {
  const q = questions[qIdx];
  const optsDivButtons = document.querySelectorAll(`#opts-${qIdx} .option`);
  const expDiv = document.getElementById(`exp-${qIdx}`);
  if (expDiv.classList.contains('show')) return;

  answered++;
  const isCorrect = selectedIdx === q.ans;
  if (isCorrect) correct++;

  optsDivButtons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('correct');
    else if (i === selectedIdx && !isCorrect) btn.classList.add('wrong');
  });

  expDiv.classList.add('show');
  updateStats();
}

function updateStats() {
  document.getElementById('answered-count').textContent = answered;
  document.getElementById('correct-count').textContent = correct;
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-live').textContent = `${correct} / ${answered}`;
  document.getElementById('progress-fill').style.width = `${(answered / questions.length) * 100}%`;
}

function revealAll() {
  questions.forEach((q, idx) => {
    const expDiv = document.getElementById(`exp-${idx}`);
    if (!expDiv) return;
    const optsBtns = document.querySelectorAll(`#opts-${idx} .option`);
    optsBtns.forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.ans) btn.classList.add('correct');
    });
    expDiv.classList.add('show');
  });
}

function resetAll() {
  answered = 0; correct = 0;
  updateStats();
  renderAll();
}

function filterCat(cat, el) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderAll();
}

renderAll();
</script>
