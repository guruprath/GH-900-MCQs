<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pull Requests & Contributions — 40 MCQs</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161b27;
    --card: #1c2333;
    --border: #2a3347;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --accent3: #f78166;
    --text: #e6edf3;
    --muted: #8b949e;
    --correct: #1a3a2a;
    --correct-border: #3fb950;
    --wrong: #3a1a1a;
    --wrong-border: #f78166;
    --highlight: rgba(88,166,255,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 0;
  }

  /* HERO */
  .hero {
    background: linear-gradient(135deg, #0d0f14 0%, #161b27 50%, #0d1117 100%);
    border-bottom: 1px solid var(--border);
    padding: 48px 24px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(88,166,255,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-badge {
    display: inline-block;
    background: rgba(88,166,255,0.1);
    border: 1px solid rgba(88,166,255,0.3);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 20px;
  }
  .hero h1 {
    font-size: clamp(28px, 5vw, 52px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #e6edf3 0%, #58a6ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  .hero p {
    color: var(--muted);
    font-size: 15px;
    font-family: 'Space Mono', monospace;
  }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
    padding: 20px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    text-align: center;
  }
  .stat-num {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    display: block;
  }
  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* CONTROLS */
  .controls {
    max-width: 900px;
    margin: 28px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }
  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: var(--accent);
    color: #0d0f14;
  }
  .btn-primary:hover { background: #79b8ff; transform: translateY(-1px); }
  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger {
    background: transparent;
    color: var(--accent3);
    border: 1px solid var(--accent3);
  }
  .btn-danger:hover { background: var(--accent3); color: #fff; }

  .filter-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn.active, .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(88,166,255,0.08);
  }

  /* MAIN */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 24px 60px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* QUESTION CARD */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
    animation: fadeIn 0.3s ease both;
  }
  .q-card:hover { border-color: #2d3f5a; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 20px 22px 16px;
  }
  .q-num {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    background: rgba(88,166,255,0.12);
    border: 1px solid rgba(88,166,255,0.25);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin-top: 2px;
  }
  .q-text {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.55;
    color: var(--text);
    flex: 1;
  }
  .q-category {
    flex-shrink: 0;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid;
  }

  .options {
    padding: 0 22px 16px 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.18s;
    background: var(--surface);
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    text-align: left;
    width: 100%;
    font-family: 'Syne', sans-serif;
  }
  .option:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--highlight);
  }
  .option-letter {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: rgba(139,148,158,0.12);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    margin-top: 1px;
    transition: all 0.18s;
  }
  .option.correct {
    background: var(--correct);
    border-color: var(--correct-border);
  }
  .option.correct .option-letter {
    background: var(--correct-border);
    color: #fff;
    border-color: var(--correct-border);
  }
  .option.wrong {
    background: var(--wrong);
    border-color: var(--wrong-border);
  }
  .option.wrong .option-letter {
    background: var(--wrong-border);
    color: #fff;
    border-color: var(--wrong-border);
  }
  .option:disabled { cursor: default; }

  .answer-reveal {
    margin: 0 22px 18px;
    padding: 12px 16px;
    background: rgba(63,185,80,0.08);
    border: 1px solid rgba(63,185,80,0.2);
    border-radius: 8px;
    font-size: 13px;
    color: var(--accent2);
    font-family: 'Space Mono', monospace;
    display: none;
    line-height: 1.6;
  }
  .answer-reveal.show { display: block; }
  .answer-reveal strong { color: #3fb950; }

  /* SCORE PANEL */
  #score-panel {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 999;
    min-width: 140px;
  }
  #score-panel .sp-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #score-panel .sp-val {
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent2);
  }

  /* CATEGORY COLORS */
  .cat-commit { color: #58a6ff; border-color: rgba(88,166,255,0.3); }
  .cat-pr-body { color: #d2a8ff; border-color: rgba(210,168,255,0.3); }
  .cat-sidebar { color: #3fb950; border-color: rgba(63,185,80,0.3); }
  .cat-notifications { color: #ffa657; border-color: rgba(255,166,87,0.3); }
  .cat-general { color: #79c0ff; border-color: rgba(121,192,255,0.3); }
  .cat-accessibility { color: #f78166; border-color: rgba(247,129,102,0.3); }

  .progress-bar {
    height: 3px;
    background: var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s ease;
  }

  @media(max-width:600px) {
    .stats-bar { gap: 20px; }
    .hero { padding: 36px 16px 28px; }
    #score-panel { bottom: 12px; right: 12px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">Quiz · 40 Questions</div>
  <h1>Pull Requests & Contributions</h1>
  <p>Commit Messages, Accessibility & PR Workflow</p>
</div>

<div class="stats-bar">
  <div class="stat"><span class="stat-num" id="total-count">40</span><span class="stat-label">Questions</span></div>
  <div class="stat"><span class="stat-num" id="answered-count">0</span><span class="stat-label">Answered</span></div>
  <div class="stat"><span class="stat-num" id="correct-count" style="color:var(--accent2)">0</span><span class="stat-label">Correct</span></div>
  <div class="stat"><span class="stat-num" id="score-pct" style="color:var(--accent)">0%</span><span class="stat-label">Score</span></div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

<div class="controls">
  <div class="filter-group">
    <button class="filter-btn active" onclick="filterCat('all',this)">All</button>
    <button class="filter-btn" onclick="filterCat('Commit Messages',this)">Commit Messages</button>
    <button class="filter-btn" onclick="filterCat('PR Body',this)">PR Body</button>
    <button class="filter-btn" onclick="filterCat('Sidebar & Labels',this)">Sidebar & Labels</button>
    <button class="filter-btn" onclick="filterCat('Notifications',this)">Notifications</button>
    <button class="filter-btn" onclick="filterCat('General',this)">General</button>
    <button class="filter-btn" onclick="filterCat('Accessibility',this)">Accessibility</button>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn btn-secondary" onclick="revealAll()">Show All Answers</button>
    <button class="btn btn-danger" onclick="resetAll()">Reset</button>
  </div>
</div>

<main id="quiz-container"></main>

<div id="score-panel">
  <span class="sp-label">Live Score</span>
  <span class="sp-val" id="score-live">0 / 0</span>
</div>

<script>
const questions = [
  // ── COMMIT MESSAGES ────────────────────────────────────────────────
  { cat: "Commit Messages", q: "What sentence should your Git commit message subject line logically complete?", opts: ["In this commit, I am...", "If applied, this commit will...", "The code previously did this, now it...", "This PR is intended to..."], ans: 1, exp: "Your Git commit message subject line should complete the following sentence: If applied, this commit will <your subject line here>." },
  { cat: "Commit Messages", q: "Which verb tense and mood should you use for a succinct description in the subject line?", opts: ["Past tense", "Future continuous", "Imperative, present tense", "Passive voice"], ans: 2, exp: "Include a succinct description of the change by using the imperative, present tense." },
  { cat: "Commit Messages", q: "Based on the text's guidelines, which of the following words is the correct way to start a commit subject line?", opts: ["Added", "Adds", "Add", "Adding"], ans: 2, exp: "For example, use 'add' not 'added' or 'adds'." },
  { cat: "Commit Messages", q: "What is the recommended maximum character limit for a commit message subject line?", opts: ["30 characters", "50 characters", "72 characters", "100 characters"], ans: 1, exp: "Limit your subject line to 50 characters." },
  { cat: "Commit Messages", q: "How should the first letter of your commit message subject line be formatted?", opts: ["It must be lowercase", "It must be an emoji", "It should start with a capital letter", "It must be wrapped in brackets"], ans: 2, exp: "Start with a capital letter." },
  { cat: "Commit Messages", q: "How should you punctuate the end of your commit message subject line?", opts: ["End with a period (.)", "End with an exclamation mark (!)", "Don't end with a period (.)", "End with a semicolon (;)"], ans: 2, exp: "Start with a capital letter, and don't end with a period (.)." },
  { cat: "Commit Messages", q: "Are emojis or @mentions always acceptable in commit subject lines across all projects?", opts: ["Yes, they are universally encouraged", "No, be mindful that not all projects allow or encourage this", "Only @mentions are allowed, emojis are strictly forbidden", "Only emojis are allowed, @mentions are strictly forbidden"], ans: 1, exp: "You can use emojis or @mention other GitHub users... but be mindful that not all projects allow or encourage this." },
  { cat: "Commit Messages", q: "Which of the following commit subject lines is formatted correctly according to the text?", opts: ["Fixes the login page bug.", "fixed the login page bug", "Fix the login page bug", "Fixed the login page bug."], ans: 2, exp: "It uses imperative present tense ('Fix'), starts with a capital letter, does not end with a period, and logically completes 'If applied, this commit will...'." },
  { cat: "Commit Messages", q: "Why might a project not want emojis in a commit subject line?", opts: ["GitHub prevents pushing commits with emojis", "It breaks the Git version history", "Not all projects allow or encourage this convention", "Emojis take up 10 characters each"], ans: 2, exp: "Be mindful that not all projects allow or encourage this." },

  // ── PR BODY ─────────────────────────────────────────────────
  { cat: "PR Body", q: "What tense should you continue to use for the body of your message and pull request?", opts: ["Past tense", "Present tense", "Future tense", "Perfect tense"], ans: 1, exp: "For the body of your message and pull request, continue to use present tense." },
  { cat: "PR Body", q: "What critical piece of context must you include in the body of your pull request?", opts: ["The exact terminal commands you used", "A copy of your local environment variables", "The motivation for the change", "The full history of the repository"], ans: 2, exp: "Make sure to include the motivation for the change." },
  { cat: "PR Body", q: "When explaining your changes, what should you contrast your change with?", opts: ["Other contributors' code", "The previous behavior", "Future planned features", "Competitors' software behavior"], ans: 1, exp: "Contrast your change with the previous behavior." },
  { cat: "PR Body", q: "In the PR body, you should use the space at your disposal to explain:", opts: ["The 'how' and 'when'", "The 'what' and 'why' versus the 'how'", "Only the 'how'", "The 'who' and 'where'"], ans: 1, exp: "Use the space at your disposal to explain the what and why versus the how." },
  { cat: "PR Body", q: "Regarding the size of your changes, the text recommends submitting:", opts: ["Large, comprehensive updates at once", "Small, isolated sets of changes", "Changes only when the entire feature is 100% complete", "Changes that affect every file in the repository"], ans: 1, exp: "Commit or submit for review small, isolated sets of changes." },
  { cat: "PR Body", q: "What is the primary benefit of submitting small, isolated sets of changes?", opts: ["It saves disk space on GitHub servers", "It increases the likelihood of your changes getting merged", "It allows you to skip writing a PR description", "It bypasses automated testing"], ans: 1, exp: "This practice increases the likelihood of your changes getting merged into the project." },
  { cat: "PR Body", q: "Why is focusing on the 'what' and 'why' more important than the 'how' in the PR body?", opts: ["Because the 'how' is already visible in the code diffs", "Because the maintainers don't care about the code", "Because GitHub has a strict character limit on PR bodies", "Because the 'how' is usually a trade secret"], ans: 0, exp: "While not explicitly detailed why in this exact snippet, explaining the 'what' and 'why' provides the context (motivation) that the code ('how') cannot express on its own." },

  // ── SIDEBAR & LABELS ────────────────────────────────────────────────
  { cat: "Sidebar & Labels", q: "Before submitting a pull request, what section of the interface should you check for ways to complete your PR?", opts: ["The commit history", "The repository settings", "The sidebar", "The main branch code"], ans: 2, exp: "Before you submit your pull request, check the sidebar for ways to complete your PR." },
  { cat: "Sidebar & Labels", q: "When should you manually select Reviewers or Assignees?", opts: ["Always, for every pull request", "Never, it is strictly automated", "If you're familiar with the project's team structure", "Only if you are the repository owner"], ans: 2, exp: "Select Reviewers or Assignees if you're familiar with the project's team structure." },
  { cat: "Sidebar & Labels", q: "What primary purpose do labels serve on a pull request?", opts: ["They automatically fix code errors", "They serve as a visual clue for what you're trying to accomplish", "They hide the PR from non-contributors", "They lock the thread from external comments"], ans: 1, exp: "You can use labels as a visual clue for what you're trying to accomplish." },
  { cat: "Sidebar & Labels", q: "Who besides the contributor might add a label or multiple labels to a pull request?", opts: ["A maintainer", "A random GitHub user", "Only an automated bot", "No one else is allowed"], ans: 0, exp: "A maintainer might also add a label or multiple labels." },
  { cat: "Sidebar & Labels", q: "Where can you often find guidance on using labels for a specific repository?", opts: ["In the README.md", "In the LICENSE file", "In the CONTRIBUTING.md file", "In the package.json file"], ans: 2, exp: "Add labels when there's guidance on using labels in, for instance, the CONTRIBUTING.md file." },
  { cat: "Sidebar & Labels", q: "According to the text's specific label examples, what does a red 'Bug' label mean?", opts: ["New feature or request", "Something isn't working", "This issue already exists", "Improvements to documentation"], ans: 1, exp: "Bug (red): Something isn't working." },
  { cat: "Sidebar & Labels", q: "What does the blue 'Documentation' label indicate?", opts: ["A broken link in the code", "A duplicate pull request", "Improvements or additions to documentation", "A brand new feature"], ans: 2, exp: "Documentation (blue): Improvements or additions to documentation." },
  { cat: "Sidebar & Labels", q: "What does the gray 'Duplicate' label signify?", opts: ["The code was copied from Stack Overflow", "This issue or pull request already exists", "The pull request needs to be run twice in CI", "It is a backup branch"], ans: 1, exp: "Duplicate (gray): This issue or pull request already exists." },
  { cat: "Sidebar & Labels", q: "What does the teal 'Enhancement' label represent?", opts: ["A minor typo fix", "A visual UI bug", "New feature or request", "A closed issue"], ans: 2, exp: "Enhancement (teal): New feature or request." },
  { cat: "Sidebar & Labels", q: "What happens if you successfully link an issue in the sidebar of a merged pull request?", opts: ["It automatically creates a new issue", "It might close the corresponding issue", "It deletes the linked issue entirely", "It emails every user who starred the repository"], ans: 1, exp: "Optionally, you can link issues in the sidebar, where successfully merging a pull request might close the corresponding issue." },

  // ── NOTIFICATIONS ───────────────────────────────────────────────
  { cat: "Notifications", q: "What does the 'Not subscribed' notification setting do?", opts: ["You receive zero emails ever", "You only receive notifications when you participated or were @mentioned", "Your GitHub account is paused", "You receive a daily digest only"], ans: 1, exp: "Not subscribed: Only receive notifications when you participated or were @mentioned." },
  { cat: "Notifications", q: "If you want to receive ALL notifications for a specific pull request, which option should you choose?", opts: ["Not subscribed", "Custom", "Subscribed", "Global"], ans: 2, exp: "Subscribed: Receive all notifications for this pull request." },
  { cat: "Notifications", q: "What does the 'Custom' notification setting allow you to configure?", opts: ["You write your own automated notification emails", "You are only notified for the events you select", "You can change the color of the GitHub interface", "You forward notifications to a Slack webhook"], ans: 1, exp: "Custom: Only be notified for the events you select." },

  // ── GENERAL & WORKFLOW ─────────────────────────────────────────────
  { cat: "General", q: "What is the primary aim of the 'First Contributions' project mentioned in the text?", opts: ["To write an operating system", "To guide the way beginners make their first contribution", "To host all open-source repositories", "To teach advanced Git rebasing"], ans: 1, exp: "The First Contributions project aims to 'guide the way beginners make their first contribution.'" },
  { cat: "General", q: "The First Contributions project provides guides for the command line as well as what else?", opts: ["Only mobile applications", "Several graphical user interfaces (GUIs)", "Virtual Reality coding environments", "Hardware assembly"], ans: 1, exp: "It has guides for both using the command line and several graphical user interfaces (GUIs)." },
  { cat: "General", q: "Where should you look in the First Contributions project to find support for different languages?", opts: ["The Locales folder", "The Languages directory", "The Translations folder", "The I18n settings"], ans: 2, exp: "Make sure to check the Translations folder." },
  { cat: "General", q: "How much time does the text suggest you should dedicate to writing your pull request?", opts: ["A few seconds", "Roughly as much time as you did in making the change to the project", "Exactly 1 hour", "None, if the code is self-explanatory"], ans: 1, exp: "Put roughly as much time into writing your PR as you did in making the change to the project." },
  { cat: "General", q: "Why is a good subject line and a well-written PR body important for the maintainers?", opts: ["It helps them categorize and prioritize (triage) community contributions", "It allows them to auto-merge without reading the code", "It generates automatic funding for the project", "It bypasses all CI/CD pipelines"], ans: 0, exp: "Your efforts will help the maintainers categorize and prioritize (triage) community contributions." },
  { cat: "General", q: "If a repository has a CONTRIBUTING.md file but no formal PR template, what should you do?", opts: ["Follow the guidance in the CONTRIBUTING.md file when filling in your pull request", "Submit a blank PR description", "Email the maintainer for a template", "Create your own PR template and merge it first"], ans: 0, exp: "If the repository has a CONTRIBUTING.md file or a PR template, follow its guidance when filling in your pull request." },

  // ── ACCESSIBILITY ─────────────────────────────────────────────
  { cat: "Accessibility", q: "Whose Accessibility Guidelines and Requirements are explicitly referenced in the bonus section?", opts: ["Google's", "Apple's", "Microsoft's", "The Linux Foundation's"], ans: 2, exp: "Bonus: Check Microsoft's Accessibility Guidelines and Requirements." },
  { cat: "Accessibility", q: "What specific type of language do the accessibility guidelines advise avoiding when describing interactions with UI?", opts: ["Technical jargon", "Ableist language", "Foreign languages", "Passive voice"], ans: 1, exp: "In particular, see the information about describing interactions with UI to avoid ableist language in your contributions." },
  { cat: "Accessibility", q: "Why is it important to use generic verbs for UI interactions in documentation/PRs?", opts: ["Because customers interact with products using different input methods (keyboard, mouse, touch, voice)", "Because it saves character space in the commit message", "Because generic verbs are easier to compile into binary code", "Because it is legally required by international copyright law"], ans: 0, exp: "Customers interact with products by using different input methods. For example, they can use the keyboard, a mouse, touch, voice, and more." },
  { cat: "Accessibility", q: "According to the accessibility guidelines, which word should you use instead of input-specific verbs like 'click' or 'swipe'?", opts: ["Press", "Hit", "Select", "Touch"], ans: 2, exp: "For instance, use select instead of the input-specific click or swipe." },
  { cat: "Accessibility", q: "Why are words like 'click' or 'swipe' considered input-specific and problematic for accessibility?", opts: ["They imply the user must have a specific device like a touchscreen or a mouse", "They are outdated terms from older operating systems", "They are trademarked terms by hardware companies", "They do not translate well to other spoken languages"], ans: 0, exp: "They assume a specific input method (mouse for click, touch for swipe), whereas users might use voice or a keyboard. Generic verbs work with any input method." }
];

const catColorMap = { 
  "Commit Messages": "cat-commit",
  "PR Body": "cat-pr-body",
  "Sidebar & Labels": "cat-sidebar",
  "Notifications": "cat-notifications",
  "General": "cat-general",
  "Accessibility": "cat-accessibility"
};

let answered = 0, correct = 0, currentFilter = 'all';

function renderAll() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  const filtered = currentFilter === 'all' ? questions : questions.filter(q => q.cat === currentFilter);
  filtered.forEach((q, idx) => {
    const globalIdx = questions.indexOf(q);
    container.appendChild(buildCard(q, globalIdx, idx + 1));
  });
}

function buildCard(q, globalIdx, displayNum) {
  const card = document.createElement('div');
  card.className = 'q-card';
  card.id = `q-${globalIdx}`;
  card.style.animationDelay = `${(displayNum - 1) * 0.03}s`;

  const catClass = catColorMap[q.cat] || 'cat-general';
  const letters = ['A','B','C','D'];

  card.innerHTML = `
    <div class="q-header">
      <div class="q-num">${String(displayNum).padStart(2,'0')}</div>
      <div class="q-text">${q.q}</div>
      <span class="q-category ${catClass}">${q.cat}</span>
    </div>
    <div class="options" id="opts-${globalIdx}">
      ${q.opts.map((opt, i) => `
        <button class="option" onclick="selectAnswer(${globalIdx},${i})" id="opt-${globalIdx}-${i}">
          <span class="option-letter">${letters[i]}</span>
          <span>${opt}</span>
        </button>`).join('')}
    </div>
    <div class="answer-reveal" id="exp-${globalIdx}">
      <strong>✓ Answer: ${letters[q.ans]}. ${q.opts[q.ans]}</strong><br>${q.exp}
    </div>`;
  return card;
}

function selectAnswer(qIdx, selectedIdx) {
  const q = questions[qIdx];
  const optsDivButtons = document.querySelectorAll(`#opts-${qIdx} .option`);
  const expDiv = document.getElementById(`exp-${qIdx}`);
  if (expDiv.classList.contains('show')) return;

  answered++;
  const isCorrect = selectedIdx === q.ans;
  if (isCorrect) correct++;

  optsDivButtons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('correct');
    else if (i === selectedIdx && !isCorrect) btn.classList.add('wrong');
  });

  expDiv.classList.add('show');
  updateStats();
}

function updateStats() {
  document.getElementById('answered-count').textContent = answered;
  document.getElementById('correct-count').textContent = correct;
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-live').textContent = `${correct} / ${answered}`;
  document.getElementById('progress-fill').style.width = `${(answered / questions.length) * 100}%`;
}

function revealAll() {
  questions.forEach((q, idx) => {
    const expDiv = document.getElementById(`exp-${idx}`);
    if (!expDiv) return;
    const optsBtns = document.querySelectorAll(`#opts-${idx} .option`);
    optsBtns.forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.ans) btn.classList.add('correct');
    });
    expDiv.classList.add('show');
  });
}

function resetAll() {
  answered = 0; correct = 0;
  updateStats();
  renderAll();
}

function filterCat(cat, el) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderAll();
}

renderAll();
</script>
</body>
