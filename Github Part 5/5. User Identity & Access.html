<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Identity & Access Quiz — 40 MCQs</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161b27;
    --card: #1c2333;
    --border: #2a3347;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --accent3: #f78166;
    --text: #e6edf3;
    --muted: #8b949e;
    --correct: #1a3a2a;
    --correct-border: #3fb950;
    --wrong: #3a1a1a;
    --wrong-border: #f78166;
    --highlight: rgba(88,166,255,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 0;
  }

  /* HERO */
  .hero {
    background: linear-gradient(135deg, #0d0f14 0%, #161b27 50%, #0d1117 100%);
    border-bottom: 1px solid var(--border);
    padding: 48px 24px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(88,166,255,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-badge {
    display: inline-block;
    background: rgba(88,166,255,0.1);
    border: 1px solid rgba(88,166,255,0.3);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 20px;
  }
  .hero h1 {
    font-size: clamp(28px, 5vw, 52px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #e6edf3 0%, #58a6ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  .hero p {
    color: var(--muted);
    font-size: 15px;
    font-family: 'Space Mono', monospace;
  }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
    padding: 20px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    text-align: center;
  }
  .stat-num {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    display: block;
  }
  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* CONTROLS */
  .controls {
    max-width: 900px;
    margin: 28px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }
  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: var(--accent);
    color: #0d0f14;
  }
  .btn-primary:hover { background: #79b8ff; transform: translateY(-1px); }
  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger {
    background: transparent;
    color: var(--accent3);
    border: 1px solid var(--accent3);
  }
  .btn-danger:hover { background: var(--accent3); color: #fff; }

  .filter-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn.active, .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(88,166,255,0.08);
  }

  /* MAIN */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 24px 60px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* QUESTION CARD */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
    animation: fadeIn 0.3s ease both;
  }
  .q-card:hover { border-color: #2d3f5a; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 20px 22px 16px;
  }
  .q-num {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    background: rgba(88,166,255,0.12);
    border: 1px solid rgba(88,166,255,0.25);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin-top: 2px;
  }
  .q-text {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.55;
    color: var(--text);
    flex: 1;
  }
  .q-category {
    flex-shrink: 0;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid;
  }

  .options {
    padding: 0 22px 16px 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.18s;
    background: var(--surface);
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    text-align: left;
    width: 100%;
    font-family: 'Syne', sans-serif;
  }
  .option:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--highlight);
  }
  .option-letter {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: rgba(139,148,158,0.12);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    margin-top: 1px;
    transition: all 0.18s;
  }
  .option.correct {
    background: var(--correct);
    border-color: var(--correct-border);
  }
  .option.correct .option-letter {
    background: var(--correct-border);
    color: #fff;
    border-color: var(--correct-border);
  }
  .option.wrong {
    background: var(--wrong);
    border-color: var(--wrong-border);
  }
  .option.wrong .option-letter {
    background: var(--wrong-border);
    color: #fff;
    border-color: var(--wrong-border);
  }
  .option:disabled { cursor: default; }

  .answer-reveal {
    margin: 0 22px 18px;
    padding: 12px 16px;
    background: rgba(63,185,80,0.08);
    border: 1px solid rgba(63,185,80,0.2);
    border-radius: 8px;
    font-size: 13px;
    color: var(--accent2);
    font-family: 'Space Mono', monospace;
    display: none;
    line-height: 1.6;
  }
  .answer-reveal.show { display: block; }
  .answer-reveal strong { color: #3fb950; }

  /* SCORE PANEL */
  #score-panel {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 999;
    min-width: 140px;
  }
  #score-panel .sp-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #score-panel .sp-val {
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent2);
  }

  /* CATEGORY COLORS */
  .cat-auth { color: #58a6ff; border-color: rgba(88,166,255,0.3); }
  .cat-apps { color: #d2a8ff; border-color: rgba(210,168,255,0.3); }
  .cat-saml { color: #3fb950; border-color: rgba(63,185,80,0.3); }
  .cat-access { color: #ffa657; border-color: rgba(255,166,87,0.3); }
  .cat-visibility { color: #f78166; border-color: rgba(247,129,102,0.3); }

  .progress-bar {
    height: 3px;
    background: var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s ease;
  }

  @media(max-width:600px) {
    .stats-bar { gap: 20px; }
    .hero { padding: 36px 16px 28px; }
    #score-panel { bottom: 12px; right: 12px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">Administration Quiz · 40 Questions</div>
  <h1>User Identity<br>& Access Management</h1>
  <p>Test your knowledge on GitHub Authentication, EMUs, SAML SSO, and Access Controls.</p>
</div>

<div class="stats-bar">
  <div class="stat"><span class="stat-num" id="total-count">40</span><span class="stat-label">Questions</span></div>
  <div class="stat"><span class="stat-num" id="answered-count">0</span><span class="stat-label">Answered</span></div>
  <div class="stat"><span class="stat-num" id="correct-count" style="color:var(--accent2)">0</span><span class="stat-label">Correct</span></div>
  <div class="stat"><span class="stat-num" id="score-pct" style="color:var(--accent)">0%</span><span class="stat-label">Score</span></div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

<div class="controls">
  <div class="filter-group">
    <button class="filter-btn active" onclick="filterCat('all',this)">All</button>
    <button class="filter-btn" onclick="filterCat('Authentication',this)">Authentication</button>
    <button class="filter-btn" onclick="filterCat('Apps & EMUs',this)">Apps & EMUs</button>
    <button class="filter-btn" onclick="filterCat('SAML SSO',this)">SAML SSO</button>
    <button class="filter-btn" onclick="filterCat('Access Controls',this)">Access Controls</button>
    <button class="filter-btn" onclick="filterCat('Visibility',this)">Visibility</button>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn btn-secondary" onclick="revealAll()">Show All Answers</button>
    <button class="btn btn-danger" onclick="resetAll()">Reset</button>
  </div>
</div>

<main id="quiz-container"></main>

<div id="score-panel">
  <span class="sp-label">Live Score</span>
  <span class="sp-val" id="score-live">0 / 0</span>
</div>

<script>
const questions = [
  // ── AUTHENTICATION (1–8) ──────────────────────────────────────────────
  { cat: "Authentication", q: "What acts as the gateway to an enterprise's software development ecosystem in GitHub?", opts: ["Continuous Integration pipelines", "Authentication", "Pull Requests", "Repository Webhooks"], ans: 1, exp: "Authentication is the gateway to your enterprise's software development ecosystem." },
  { cat: "Authentication", q: "What does strong enterprise security mandate beyond standard usernames and passwords?", opts: ["Disabling external collaborators", "Two-factor authentication (2FA) or more advanced methods like passkeys", "Storing passwords in a plaintext repository", "Using only single sign-on without 2FA"], ans: 1, exp: "Strong enterprise security mandates two-factor authentication (2FA) or more advanced methods like passkeys and biometric login." },
  { cat: "Authentication", q: "What is key to maintain in a fast-paced development environment when configuring authentication?", opts: ["Prioritizing speed entirely over security", "Balancing usability with security", "Removing all access controls", "Requiring biometric scans for every single commit"], ans: 1, exp: "Balancing usability with security is key—especially in a fast-paced development environment." },
  { cat: "Authentication", q: "What are passkeys tied to in order to function as a passwordless login method?", opts: ["A specific IP address", "A physical device", "An email account", "A cloud storage drive"], ans: 1, exp: "Passkeys are a passwordless login method, tied to a physical device." },
  { cat: "Authentication", q: "Passkeys are specifically noted to be resistant to which type of attack?", opts: ["Phishing", "DDoS", "Cross-Site Scripting (XSS)", "SQL Injection"], ans: 0, exp: "Passkeys are... resistant to phishing." },
  { cat: "Authentication", q: "Which authentication standard supports biometric factors and hardware tokens like YubiKey?", opts: ["OAuth 1.0", "WebAuthn", "SAML 1.1", "LDAP"], ans: 1, exp: "WebAuthn supports biometric factors and hardware tokens like YubiKey." },
  { cat: "Authentication", q: "What is a major benefit of using passkeys and WebAuthn?", opts: ["They bypass the need for an internet connection", "They significantly reduce credential-based attacks and improve login UX", "They automatically write code reviews", "They grant administrative rights to all users"], ans: 1, exp: "These methods significantly reduce credential-based attacks and improve login UX." },
  { cat: "Authentication", q: "How does GitHub Mobile enhance the 2FA experience for users?", opts: ["By generating one-time printable backup codes", "By supporting push notifications for quick, secure approval", "By removing the need for a password entirely", "By restricting logins to mobile devices only"], ans: 1, exp: "Users can authenticate with GitHub Mobile, which supports push notifications for quick, secure approval." },

  // ── APPS & EMUs (9–15) ──────────────────────────────────────────────
  { cat: "Apps & EMUs", q: "What authentication flow do OAuth Apps use to authenticate users?", opts: ["SAML 2.0", "OAuth 2.0 flow", "LDAP synchronization", "Active Directory bridging"], ans: 1, exp: "OAuth Apps use GitHub's OAuth 2.0 flow to authenticate users." },
  { cat: "Apps & EMUs", q: "What do OAuth Apps grant to external applications?", opts: ["Full enterprise administrative rights", "Scoped access", "Permanent SSH keys", "Root access to the database"], ans: 1, exp: "OAuth Apps use GitHub's OAuth 2.0 flow to authenticate users and grant scoped access to external applications." },
  { cat: "Apps & EMUs", q: "How do GitHub Apps authenticate to the system?", opts: ["As individual users with PATs", "As individual installations with fine-grained permissions", "Using legacy Basic Auth only", "Via SMS one-time passwords"], ans: 1, exp: "GitHub Apps authenticate as individual installations with fine-grained permissions." },
  { cat: "Apps & EMUs", q: "For which use case are GitHub Apps described as ideal?", opts: ["Managing human resources", "CI/CD and automation pipelines", "Hosting static websites", "Creating graphical user interfaces"], ans: 1, exp: "GitHub Apps authenticate as individual installations with fine-grained permissions and are ideal for CI/CD and automation pipelines." },
  { cat: "Apps & EMUs", q: "What does EMU stand for in GitHub Enterprise Cloud?", opts: ["Enterprise Mobile Users", "Enterprise Managed Users", "External Management Utilities", "Encrypted Master Units"], ans: 1, exp: "Enterprise Managed Users (EMU)" },
  { cat: "Apps & EMUs", q: "In the EMU model, authentication happens strictly through what system?", opts: ["GitHub's internal database only", "Your Identity Provider (IdP)", "Public OAuth providers like Google or Facebook", "A decentralized blockchain"], ans: 1, exp: "In GitHub Enterprise Cloud, EMUs ensure that authentication happens strictly through your Identity Provider (IdP)." },
  { cat: "Apps & EMUs", q: "What does the EMU model enforce centralized control over?", opts: ["Repository naming conventions", "Identity, credentials, and session policies", "Code formatting styles", "Billing information only"], ans: 1, exp: "Enforces centralized control over identity, credentials, and session policies." },

  // ── SAML SSO (16–24) ────────────────────────────────────────────────
  { cat: "SAML SSO", q: "What is described as one foundational capability for enterprise-grade authentication?", opts: ["SAML Single Sign-On (SSO)", "SMS-based 2FA", "Public repository access", "Deploy keys"], ans: 0, exp: "One foundational capability for enterprise-grade authentication is SAML Single Sign-On (SSO)." },
  { cat: "SAML SSO", q: "What does SAML link together?", opts: ["Your IdP with GitHub", "Your local git client with a remote server", "Multiple GitHub Organizations without an Enterprise", "OAuth apps and GitHub Apps"], ans: 0, exp: "SAML links your IdP with GitHub, enabling users to sign in across services using one set of credentials." },
  { cat: "SAML SSO", q: "When users log into GitHub, what is required to access repository data in an organization utilizing SAML SSO?", opts: ["A phone call to the admin", "SAML reauthentication via the IdP", "A new physical hardware key", "Changing their GitHub password"], ans: 1, exp: "Access to repository data requires SAML reauthentication via the IdP." },
  { cat: "SAML SSO", q: "As an Enterprise Admin, how should you authorize access?", opts: ["Grant everyone full admin rights to avoid bottlenecks", "Based on role and need-to-know", "By assigning permissions randomly", "Only when requested via a physical form"], ans: 1, exp: "As an Enterprise Admin, your responsibilities include: Authorizing access based on role and need-to-know." },
  { cat: "SAML SSO", q: "Which of the following is listed as an Enterprise Admin responsibility regarding user activity?", opts: ["Ignoring it if the user is an owner", "Monitoring and auditing user activity", "Deleting all logs every 24 hours", "Outsourcing it to public users"], ans: 1, exp: "Monitoring and auditing user activity." },
  { cat: "SAML SSO", q: "Why must an Enterprise Admin carefully scope permissions?", opts: ["To maximize the surface area for testing", "To minimize surface area for attacks", "To increase the cost of GitHub billing", "To slow down the deployment process"], ans: 1, exp: "Scoping permissions and minimizing surface area for attacks." },
  { cat: "SAML SSO", q: "Which of the following is a supported SAML Identity Provider (IdP) for GitHub?", opts: ["Microsoft Entra ID", "Firebase Authentication", "Amazon Cognito", "Auth0"], ans: 0, exp: "Supported providers include: Active Directory Federation Services (AD FS), Microsoft Entra ID, Okta, OneLogin, PingOne, Shibboleth." },
  { cat: "SAML SSO", q: "Which standard does GitHub provide limited support for regarding identity providers?", opts: ["OAuth 1.0", "SAML 2.0", "LDAP v3", "OpenID Connect"], ans: 1, exp: "GitHub provides limited support for identity providers that implement the SAML 2.0 standard." },
  { cat: "SAML SSO", q: "Before granting access to organization or enterprise resources, what does GitHub use the IdP for?", opts: ["To format code", "To verify user identity", "To run CI/CD actions", "To host static assets"], ans: 1, exp: "GitHub uses the IdP to verify user identity before granting access to organization or enterprise resources." },

  // ── ACCESS CONTROLS (25–37) ─────────────────────────────────────────
  { cat: "Access Controls", q: "Access in GitHub is governed by what kind of model?", opts: ["A completely flat hierarchy", "A robust, multi-layered authorization model", "A single-tier access pass", "A decentralized blockchain model"], ans: 1, exp: "Access in GitHub is governed by a robust, multi-layered authorization model." },
  { cat: "Access Controls", q: "Unlike classic PATs, what do fine-grained PATs do?", opts: ["They never expire", "Restrict access to specific repositories and scopes", "They cannot be used via the API", "They grant access to all organizations globally"], ans: 1, exp: "Unlike classic PATs, fine-grained PATs: Restrict access to specific repositories and scopes." },
  { cat: "Access Controls", q: "To reduce risk exposure, what feature do fine-grained PATs support?", opts: ["Manual deletion only", "Automatic expiration", "Infinite lifespan", "Global administrative bypass"], ans: 1, exp: "Support automatic expiration for reduced risk exposure." },
  { cat: "Access Controls", q: "For compliance purposes, what do fine-grained PATs offer?", opts: ["Anonymous access logs", "Enhanced traceability and compliance controls", "The ability to bypass the Audit Log", "Hidden tracking numbers"], ans: 1, exp: "Offer enhanced traceability and compliance controls." },
  { cat: "Access Controls", q: "Who has the ability to define Custom Repository Roles in GitHub?", opts: ["Any organization member", "Outside collaborators", "Admins", "Read-only users"], ans: 2, exp: "Admins can define custom roles that extend beyond the default permission sets." },
  { cat: "Access Controls", q: "What do custom repository roles extend beyond?", opts: ["The GitHub terms of service", "The default permission sets", "The organization's billing plan", "The IdP synchronization limits"], ans: 1, exp: "Admins can define custom roles that extend beyond the default permission sets." },
  { cat: "Access Controls", q: "Custom roles support delegated access that is tailored to what?", opts: ["Global internet standards", "Unique workflows", "Open-source licensing rules", "External auditing firms"], ans: 1, exp: "This supports: Delegated access tailored to unique workflows." },
  { cat: "Access Controls", q: "For sensitive repositories, custom roles help enforce what principle?", opts: ["Maximum access", "Least-privilege", "First-come, first-served", "Open collaboration"], ans: 1, exp: "This supports: Least-privilege enforcement for sensitive repositories." },
  { cat: "Access Controls", q: "Which of the following is an example of a global security control you can enforce?", opts: ["Mandatory 2FA for all users", "Requiring everyone to use a specific IDE", "Forcing all repositories to be public", "Disabling all APIs"], ans: 0, exp: "You can enforce global security controls such as: Mandatory 2FA for all users." },
  { cat: "Access Controls", q: "How can you restrict access to approved networks?", opts: ["By disabling PATs", "By using IP allowlists", "By enforcing custom roles", "By deleting organization members"], ans: 1, exp: "IP allowlists to restrict access to approved networks." },
  { cat: "Access Controls", q: "Regarding OAuth apps, what global security policy can be applied?", opts: ["Automatically approving all of them", "Blocking unverified OAuth apps unless explicitly approved", "Banning all OAuth apps permanently", "Requiring OAuth apps to pay a fee"], ans: 1, exp: "Blocking unverified OAuth apps unless explicitly approved." },
  { cat: "Access Controls", q: "Which of the following falls under Organization-level controls?", opts: ["Global policy enforcement across all orgs", "Management of external collaborators and team-based access", "Centralized SAML enforcement", "IdP-based login restrictions across the enterprise"], ans: 1, exp: "Organization-level controls include default roles, team-based access, and the management of external collaborators." },
  { cat: "Access Controls", q: "Which of the following is considered Enterprise-level governance?", opts: ["Setting a single repository's custom role", "Centralized SAML enforcement and global policy enforcement", "Adding a label to a pull request", "Writing code in a repository"], ans: 1, exp: "Enterprise-level governance includes: Centralized SAML enforcement. IdP-based login restrictions. Global policy enforcement..." },

  // ── VISIBILITY (38–40) ──────────────────────────────────────────────
  { cat: "Visibility", q: "Which repository visibility option makes the repository available to anyone on the internet?", opts: ["Internal", "Private", "Public", "Secret"], ans: 2, exp: "Public: Available to anyone on the internet." },
  { cat: "Visibility", q: "Which repository visibility option restricts access to selected users only?", opts: ["Public", "Internal", "Private", "Global"], ans: 2, exp: "Private: Restricted to selected users." },
  { cat: "Visibility", q: "Which repository visibility option is visible to all members within the enterprise but hidden from external users?", opts: ["Public", "Private", "Internal", "Enterprise-Public"], ans: 2, exp: "Internal: Visible to all members within the enterprise but hidden from external users." }
];

const catColorMap = { 
  "Authentication":"cat-auth",
  "Apps & EMUs":"cat-apps",
  "SAML SSO":"cat-saml",
  "Access Controls":"cat-access",
  "Visibility":"cat-visibility"
};

let answered = 0, correct = 0, currentFilter = 'all';

function renderAll() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  const filtered = currentFilter === 'all' ? questions : questions.filter(q => q.cat === currentFilter);
  filtered.forEach((q, idx) => {
    const globalIdx = questions.indexOf(q);
    container.appendChild(buildCard(q, globalIdx, idx + 1));
  });
}

function buildCard(q, globalIdx, displayNum) {
  const card = document.createElement('div');
  card.className = 'q-card';
  card.id = `q-${globalIdx}`;
  card.style.animationDelay = `${(displayNum - 1) * 0.03}s`;

  const catClass = catColorMap[q.cat] || 'cat-auth';
  const letters = ['A','B','C','D'];

  card.innerHTML = `
    <div class="q-header">
      <div class="q-num">${String(displayNum).padStart(2,'0')}</div>
      <div class="q-text">${q.q}</div>
      <span class="q-category ${catClass}">${q.cat}</span>
    </div>
    <div class="options" id="opts-${globalIdx}">
      ${q.opts.map((opt, i) => `
        <button class="option" onclick="selectAnswer(${globalIdx},${i})" id="opt-${globalIdx}-${i}">
          <span class="option-letter">${letters[i]}</span>
          <span>${opt}</span>
        </button>`).join('')}
    </div>
    <div class="answer-reveal" id="exp-${globalIdx}">
      <strong>✓ Answer: ${letters[q.ans]}. ${q.opts[q.ans]}</strong><br>${q.exp}
    </div>`;
  return card;
}

function selectAnswer(qIdx, selectedIdx) {
  const q = questions[qIdx];
  const optsDivButtons = document.querySelectorAll(`#opts-${qIdx} .option`);
  const expDiv = document.getElementById(`exp-${qIdx}`);
  if (expDiv.classList.contains('show')) return; // already answered

  answered++;
  const isCorrect = selectedIdx === q.ans;
  if (isCorrect) correct++;

  optsDivButtons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('correct');
    else if (i === selectedIdx && !isCorrect) btn.classList.add('wrong');
  });

  expDiv.classList.add('show');
  updateStats();
}

function updateStats() {
  document.getElementById('answered-count').textContent = answered;
  document.getElementById('correct-count').textContent = correct;
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-live').textContent = `${correct} / ${answered}`;
  document.getElementById('progress-fill').style.width = `${(answered / questions.length) * 100}%`;
}

function revealAll() {
  questions.forEach((q, idx) => {
    const expDiv = document.getElementById(`exp-${idx}`);
    if (!expDiv) return;
    const optsBtns = document.querySelectorAll(`#opts-${idx} .option`);
    optsBtns.forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.ans) btn.classList.add('correct');
    });
    expDiv.classList.add('show');
  });
}

function resetAll() {
  answered = 0; correct = 0;
  updateStats();
  renderAll();
}

function filterCat(cat, el) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderAll();
}

renderAll();
</script>
</body>
</html>
