<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Access & Governance Quiz — 60 MCQs</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161b27;
    --card: #1c2333;
    --border: #2a3347;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --accent3: #f78166;
    --text: #e6edf3;
    --muted: #8b949e;
    --correct: #1a3a2a;
    --correct-border: #3fb950;
    --wrong: #3a1a1a;
    --wrong-border: #f78166;
    --highlight: rgba(88,166,255,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 0;
  }

  /* HERO */
  .hero {
    background: linear-gradient(135deg, #0d0f14 0%, #161b27 50%, #0d1117 100%);
    border-bottom: 1px solid var(--border);
    padding: 48px 24px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(88,166,255,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-badge {
    display: inline-block;
    background: rgba(88,166,255,0.1);
    border: 1px solid rgba(88,166,255,0.3);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 20px;
  }
  .hero h1 {
    font-size: clamp(28px, 5vw, 52px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #e6edf3 0%, #58a6ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  .hero p {
    color: var(--muted);
    font-size: 15px;
    font-family: 'Space Mono', monospace;
  }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
    padding: 20px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    text-align: center;
  }
  .stat-num {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    display: block;
  }
  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* CONTROLS */
  .controls {
    max-width: 900px;
    margin: 28px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }
  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: var(--accent);
    color: #0d0f14;
  }
  .btn-primary:hover { background: #79b8ff; transform: translateY(-1px); }
  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger {
    background: transparent;
    color: var(--accent3);
    border: 1px solid var(--accent3);
  }
  .btn-danger:hover { background: var(--accent3); color: #fff; }

  .filter-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn.active, .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(88,166,255,0.08);
  }

  /* MAIN */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 24px 60px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* QUESTION CARD */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
    animation: fadeIn 0.3s ease both;
  }
  .q-card:hover { border-color: #2d3f5a; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 20px 22px 16px;
  }
  .q-num {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    background: rgba(88,166,255,0.12);
    border: 1px solid rgba(88,166,255,0.25);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin-top: 2px;
  }
  .q-text {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.55;
    color: var(--text);
    flex: 1;
  }
  .q-category {
    flex-shrink: 0;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid;
  }

  .options {
    padding: 0 22px 16px 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.18s;
    background: var(--surface);
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    text-align: left;
    width: 100%;
    font-family: 'Syne', sans-serif;
  }
  .option:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--highlight);
  }
  .option-letter {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: rgba(139,148,158,0.12);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    margin-top: 1px;
    transition: all 0.18s;
  }
  .option.correct {
    background: var(--correct);
    border-color: var(--correct-border);
  }
  .option.correct .option-letter {
    background: var(--correct-border);
    color: #fff;
    border-color: var(--correct-border);
  }
  .option.wrong {
    background: var(--wrong);
    border-color: var(--wrong-border);
  }
  .option.wrong .option-letter {
    background: var(--wrong-border);
    color: #fff;
    border-color: var(--wrong-border);
  }
  .option:disabled { cursor: default; }

  .answer-reveal {
    margin: 0 22px 18px;
    padding: 12px 16px;
    background: rgba(63,185,80,0.08);
    border: 1px solid rgba(63,185,80,0.2);
    border-radius: 8px;
    font-size: 13px;
    color: var(--accent2);
    font-family: 'Space Mono', monospace;
    display: none;
    line-height: 1.6;
  }
  .answer-reveal.show { display: block; }
  .answer-reveal strong { color: #3fb950; }

  /* SCORE PANEL */
  #score-panel {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 999;
    min-width: 140px;
  }
  #score-panel .sp-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #score-panel .sp-val {
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent2);
  }

  /* CATEGORY COLORS */
  .cat-org-perms { color: #58a6ff; border-color: rgba(88,166,255,0.3); }
  .cat-ent-perms { color: #d2a8ff; border-color: rgba(210,168,255,0.3); }
  .cat-structure { color: #3fb950; border-color: rgba(63,185,80,0.3); }
  .cat-ad-sync { color: #f78166; border-color: rgba(247,129,102,0.3); }
  .cat-scripting { color: #ffa657; border-color: rgba(255,166,87,0.3); }

  .progress-bar {
    height: 3px;
    background: var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s ease;
  }

  @media(max-width:600px) {
    .stats-bar { gap: 20px; }
    .hero { padding: 36px 16px 28px; }
    #score-panel { bottom: 12px; right: 12px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">Administration Quiz · 60 Questions</div>
  <h1>Enterprise Access<br>& Governance</h1>
  <p>Test your knowledge on managing permissions, organizational structures, AD sync, and scripting best practices.</p>
</div>

<div class="stats-bar">
  <div class="stat"><span class="stat-num" id="total-count">60</span><span class="stat-label">Questions</span></div>
  <div class="stat"><span class="stat-num" id="answered-count">0</span><span class="stat-label">Answered</span></div>
  <div class="stat"><span class="stat-num" id="correct-count" style="color:var(--accent2)">0</span><span class="stat-label">Correct</span></div>
  <div class="stat"><span class="stat-num" id="score-pct" style="color:var(--accent)">0%</span><span class="stat-label">Score</span></div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

<div class="controls">
  <div class="filter-group">
    <button class="filter-btn active" onclick="filterCat('all',this)">All</button>
    <button class="filter-btn" onclick="filterCat('Org Permissions',this)">Org Permissions</button>
    <button class="filter-btn" onclick="filterCat('Enterprise Permissions',this)">Enterprise Permissions</button>
    <button class="filter-btn" onclick="filterCat('Structure & Policies',this)">Structure & Policies</button>
    <button class="filter-btn" onclick="filterCat('Active Directory',this)">Active Directory</button>
    <button class="filter-btn" onclick="filterCat('Scripting',this)">Scripting</button>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn btn-secondary" onclick="revealAll()">Show All Answers</button>
    <button class="btn btn-danger" onclick="resetAll()">Reset</button>
  </div>
</div>

<main id="quiz-container"></main>

<div id="score-panel">
  <span class="sp-label">Live Score</span>
  <span class="sp-val" id="score-live">0 / 0</span>
</div>

<script>
const questions = [
  // ── ORGANIZATION PERMISSIONS (1–13) ──────────────────────────────────────
  { cat: "Org Permissions", q: "What provides a centralized way for teams to collaborate on projects while maintaining controlled access to repositories?", opts: ["GitHub internal repositories", "GitHub organizations", "GitHub Actions", "Active Directory Groups"], ans: 1, exp: "GitHub organizations provide a centralized way for teams to collaborate on projects while maintaining controlled access to repositories and sensitive data." },
  { cat: "Org Permissions", q: "What determines what members and teams can do within an organization?", opts: ["Enterprise policies", "Organization permissions", "Active Directory settings", "Repository tags"], ans: 1, exp: "Organization permissions determine what members and teams can do within the organization, ensuring that each user has the appropriate level of access." },
  { cat: "Org Permissions", q: "Which organization role can add or remove other users to and from the organization?", opts: ["Owner", "Member", "Moderator", "Security manager"], ans: 0, exp: "Organization owners can do everything that organization members can do, and they can add or remove other users to and from the organization." },
  { cat: "Org Permissions", q: "What is the minimum recommended number of Owners in an organization?", opts: ["One", "Two", "Three", "Five"], ans: 1, exp: "This role [Owner] should be limited to no less than two people in your organization." },
  { cat: "Org Permissions", q: "Who has the ability to create and manage organization repositories and teams?", opts: ["Outside collaborator", "Moderator", "Member", "Billing manager"], ans: 2, exp: "Organization members can create and manage organization repositories and teams." },
  { cat: "Org Permissions", q: "Which role is specifically responsible for blocking and unblocking nonmember contributors?", opts: ["Security manager", "Moderator", "Owner", "Billing manager"], ans: 1, exp: "Organization moderators can block and unblock nonmember contributors, set interaction limits, and hide comments..." },
  { cat: "Org Permissions", q: "An Organization Moderator can hide comments in which type of repositories?", opts: ["Private repositories", "Public repositories that the organization owns", "Internal repositories only", "All repositories within the enterprise"], ans: 1, exp: "Organization moderators can... hide comments in public repositories that the organization owns." },
  { cat: "Org Permissions", q: "Who can view and edit billing information at the organizational level?", opts: ["Security manager", "Member", "Billing manager", "Outside collaborator"], ans: 2, exp: "Organization billing managers can view and edit billing information." },
  { cat: "Org Permissions", q: "Who can manage security alerts and settings across the organization?", opts: ["Moderator", "Security managers", "Billing manager", "Outside collaborator"], ans: 1, exp: "Organization security managers can manage security alerts and settings across your organization." },
  { cat: "Org Permissions", q: "Which organization role can inherently read permissions for all repositories in the organization?", opts: ["Moderator", "Security managers", "Billing manager", "Member"], ans: 1, exp: "They [Security managers] can also read permissions for all repositories in the organization." },
  { cat: "Org Permissions", q: "Which role allows access to one or more organization repositories without the user being an explicit member of the organization?", opts: ["Outside collaborator", "Guest collaborator", "Moderator", "Member"], ans: 0, exp: "Outside collaborators... can access one or more organization repositories. They aren't explicit members of the organization." },
  { cat: "Org Permissions", q: "Which of the following is an example of someone who might be an 'Outside collaborator'?", opts: ["The Enterprise Owner", "A consultant or temporary employee", "An Active Directory admin", "A Security manager"], ans: 1, exp: "Outside collaborators, such as a consultant or temporary employee..." },
  { cat: "Org Permissions", q: "In a small organization where everyone is highly trusted, what might be a reasonable approach to default permissions?", opts: ["Default no access", "Give all members write permissions by default", "Make everyone a Security Manager", "Only allow read access to public repos"], ans: 1, exp: "If you trust everyone with pushing changes to any repository, you might prefer to give all members write permissions by default." },

  // ── ENTERPRISE PERMISSIONS (14–25) ───────────────────────────────────────
  { cat: "Enterprise Permissions", q: "Enterprise accounts are essentially collections of what?", opts: ["Outside collaborators", "Billing profiles", "Organizations", "Nested teams"], ans: 2, exp: "Recall from earlier that enterprise accounts are collections of organizations." },
  { cat: "Enterprise Permissions", q: "If an individual user is a member of an organization within an enterprise, are they also a member of the enterprise?", opts: ["No, enterprise membership must be granted separately", "Yes, by extension", "Only if they are an Owner", "Only if they use Active Directory"], ans: 1, exp: "By extension, each individual user account that is a member of an organization is also a member of the enterprise." },
  { cat: "Enterprise Permissions", q: "Which role has complete control over the enterprise and can take every action?", opts: ["Security manager", "Enterprise Owner", "Organization Owner", "Active Directory Admin"], ans: 1, exp: "Enterprise owners have complete control over the enterprise and can take every action..." },
  { cat: "Enterprise Permissions", q: "Who has the ability to add and remove organizations to and from the enterprise?", opts: ["Enterprise Owner", "Organization Owner", "Enterprise Member", "Billing manager"], ans: 0, exp: "Enterprise owners... can take every action, including: Adding and removing organizations to and from the enterprise." },
  { cat: "Enterprise Permissions", q: "Who is responsible for enforcing policies across organizations within an enterprise?", opts: ["Enterprise Member", "Security manager", "Enterprise Owner", "Moderator"], ans: 2, exp: "Enterprise owners... can take every action, including: Enforcing policies across organizations." },
  { cat: "Enterprise Permissions", q: "What abilities do Enterprise members possess?", opts: ["They can delete organizations", "They have the same set of abilities as organization members", "They can manage enterprise administrators", "They can enforce enterprise-wide policies"], ans: 1, exp: "Enterprise members have the same set of abilities as organization members." },
  { cat: "Enterprise Permissions", q: "What permissions does an Enterprise billing manager have?", opts: ["Can edit code in public repositories", "Can add or remove organizations", "Can only view/edit billing info and add/remove other billing managers", "Can manage security settings enterprise-wide"], ans: 2, exp: "Enterprise billing managers can only view and edit your enterprise's billing information and add or remove other billing managers." },
  { cat: "Enterprise Permissions", q: "Which enterprise role applies only to Enterprise Managed Users and has limited access by default?", opts: ["Outside collaborator", "Guest collaborator", "Moderator", "Security manager"], ans: 1, exp: "Guest collaborator: Can be granted access to repositories or organizations, but has limited access by default (Enterprise Managed Users only)" },
  { cat: "Enterprise Permissions", q: "What policy can you set from the enterprise level that applies across all your organizations?", opts: ["Default branch naming", "Default repository permissions", "Required programming languages", "Active Directory passwords"], ans: 1, exp: "In addition to these three levels, you can also set a policy of default repository permissions across all your organizations." },
  { cat: "Enterprise Permissions", q: "How can enterprise accounts reflect complex departmental hierarchies?", opts: ["By creating more organizations", "Using Nested Teams", "Using Outside collaborators", "Using Guest collaborators"], ans: 1, exp: "Nested Teams: Enterprise accounts can use nested team structures to reflect departmental hierarchies." },
  { cat: "Enterprise Permissions", q: "How do permissions function within Nested Teams?", opts: ["Permissions are randomly assigned", "Child team permissions override parent permissions", "A parent team’s permissions cascade down to child teams", "Teams cannot share permissions"], ans: 2, exp: "A parent team’s permissions cascade down to child teams, simplifying complex access management." },
  { cat: "Enterprise Permissions", q: "Which tools can be used to automate team creation and permission assignments?", opts: ["Only external third-party tools", "GitHub’s API or GitHub Actions", "Active Directory solely", "Billing management portal"], ans: 1, exp: "Automation & Auditing: You can use GitHub’s API or GitHub Actions to automate team creation and permission assignments..." },

  // ── STRUCTURE & POLICIES (26–45) ──────────────────────────────────────────
  { cat: "Structure & Policies", q: "What is a 'Pro' of using a Single Organization regarding management?", opts: ["Decentralized administration", "Simplified Management with centralized control", "Tailored policies per team", "Redundancy of settings"], ans: 1, exp: "Single Organization - Pros - Simplified Management: Centralized control of permissions and policies." },
  { cat: "Structure & Policies", q: "What is a 'Con' of using a Single Organization regarding flexibility?", opts: ["Too much customization is required", "One-size-fits-all policies might not suit all teams", "Teams can manage their own policies freely", "It requires Active Directory"], ans: 1, exp: "Single Organization - Cons - Limited Flexibility: One-size-fits-all policies might not suit all teams." },
  { cat: "Structure & Policies", q: "How does a Single Organization impact resource sharing?", opts: ["It prevents asset sharing completely", "It requires cross-organization tools", "It allows for easier asset sharing across teams", "It duplicates assets for every team"], ans: 2, exp: "Single Organization - Pros - Resource Sharing: Easier asset sharing across teams." },
  { cat: "Structure & Policies", q: "What is a potential scalability issue when using a Single Organization?", opts: ["Billing becomes impossible", "Managing permissions can become complex as the organization grows", "You cannot use GitHub API", "It limits the number of repositories to 100"], ans: 1, exp: "Single Organization - Cons - Scalability Issues: Managing permissions can become complex as the organization grows." },
  { cat: "Structure & Policies", q: "What security risk is associated with using a Single Organization?", opts: ["Multi-factor authentication is disabled", "A single breach could impact the entire organization", "Security managers cannot be assigned", "Outside collaborators have admin rights"], ans: 1, exp: "Single Organization - Cons - Security Risks: A single breach could impact the entire organization." },
  { cat: "Structure & Policies", q: "What is a cost efficiency benefit of a Single Organization?", opts: ["GitHub provides it for free", "Reduced overhead in administrative tooling and licensing", "Zero billing for external collaborators", "Automatic discounts on Enterprise Cloud"], ans: 1, exp: "Single Organization - Pros - Cost Efficiency: Reduced overhead in administrative tooling and licensing." },
  { cat: "Structure & Policies", q: "What is a 'Pro' of using Multiple Organizations regarding policies?", opts: ["Uniform application of rules", "Tailored Policies to fit the specific needs of each team", "Centralized control of all permissions", "Cost efficiency in licensing"], ans: 1, exp: "Multiple Organizations - Pros - Tailored Policies: Customize permissions to fit the specific needs of each team." },
  { cat: "Structure & Policies", q: "How do Multiple Organizations enhance security isolation?", opts: ["By preventing outside collaborators", "By limiting the impact of a security breach to a single organization", "By automatically blocking all public repos", "By forcing Guest collaborator roles"], ans: 1, exp: "Multiple Organizations - Pros - Enhanced Isolation: Limits the impact of a security breach to a single organization." },
  { cat: "Structure & Policies", q: "What administrative advantage is granted to teams in a Multiple Organization setup?", opts: ["Centralized administration", "Decentralized Administration, where teams manage their own policies", "No administration required", "Enterprise Owners are the only admins"], ans: 1, exp: "Multiple Organizations - Pros - Decentralized Administration: Teams can manage their own policies and permissions." },
  { cat: "Structure & Policies", q: "What is a 'Con' of Multiple Organizations related to administrative effort?", opts: ["Simplified management", "Redundancy and potential duplication of settings", "Inability to use Guest collaborators", "Lower overall cost"], ans: 1, exp: "Multiple Organizations - Cons - Redundancy: Potential duplication of settings and management efforts." },
  { cat: "Structure & Policies", q: "What is a challenge for inter-org collaboration when using Multiple Organizations?", opts: ["It is strictly prohibited by GitHub", "It may require extra tools or processes for cross-organization projects", "It automatically merges all codebases", "It prevents the use of the GitHub API"], ans: 1, exp: "Multiple Organizations - Cons - Inter-Org Collaboration: May require extra tools or processes for cross-organization projects." },
  { cat: "Structure & Policies", q: "Deciding on the default permission level is critical for balancing what two factors?", opts: ["Cost and storage", "Security and collaboration", "Speed and code quality", "Public and private visibility"], ans: 1, exp: "Deciding on the default permission level is critical to balancing security and collaboration within your enterprise." },
  { cat: "Structure & Policies", q: "What is a primary benefit of using a 'Default Read' permission?", opts: ["Empowers users to contribute directly", "Reduces bottlenecks in content creation", "Enhanced Security by minimizing the risk of unintended modifications", "Forces users to use Active Directory"], ans: 2, exp: "Default Read - Enhanced Security: Minimizes the risk of unintended modifications." },
  { cat: "Structure & Policies", q: "In what type of environment is 'Default Read' considered best?", opts: ["Where everyone is a highly trusted admin", "Where the majority of users only need to view resources", "Where open-source collaboration is the main goal", "Where speed of content creation is the only priority"], ans: 1, exp: "Default Read - Best For: Environments where the majority of users only need to view resources." },
  { cat: "Structure & Policies", q: "How does 'Default Read' help with control?", opts: ["It automatically blocks outside collaborators", "It makes it easier to audit and monitor changes", "It deletes unauthorized branches", "It prevents Guest collaborators from joining"], ans: 1, exp: "Default Read - Control: Easier to audit and monitor changes." },
  { cat: "Structure & Policies", q: "What is a major benefit of using a 'Default Write' permission?", opts: ["Enhanced security against breaches", "Easier auditing of changes", "Improved Collaboration by empowering users to contribute directly", "Lower licensing costs"], ans: 2, exp: "Default Write - Improved Collaboration: Empowers users to contribute and modify content directly." },
  { cat: "Structure & Policies", q: "How does 'Default Write' impact efficiency?", opts: ["It increases bottlenecks", "It reduces bottlenecks in content creation and updates", "It slows down API calls", "It forces manual code reviews on all repos"], ans: 1, exp: "Default Write - Efficiency: Reduces bottlenecks in content creation and updates." },
  { cat: "Structure & Policies", q: "What is the primary risk associated with a 'Default Write' policy?", opts: ["Decreased collaboration", "Increases the chance of accidental changes or misconfigurations", "Higher billing costs", "Inability to use Nested Teams"], ans: 1, exp: "Default Write - Risks: Increases the chance of accidental changes or misconfigurations if not carefully managed." },
  { cat: "Structure & Policies", q: "What is the text's overall recommendation for setting default permissions?", opts: ["Use default write for everyone", "Use a default read permission model and grant write access selectively", "Disable default permissions entirely", "Use Guest collaborator as the default"], ans: 1, exp: "Recommendation: Use a default read permission model and grant write access selectively..." },
  { cat: "Structure & Policies", q: "Which security principle does the recommended 'Default Read' model ensure adherence to?", opts: ["Principle of maximum access", "Principle of least privilege", "Principle of redundancy", "Principle of decentralized administration"], ans: 1, exp: "...ensuring adherence to the principle of least privilege." },

  { cat: "Active Directory", q: "What does AD stand for in the context of team synchronization?", opts: ["Automated Deployment", "Active Directory", "Access Delegation", "Admin Dashboard"], ans: 1, exp: "Using Active Directory (AD) for team synchronization makes user management and access control easier..." },
  { cat: "Active Directory", q: "What is the benefit of having a 'Single source of truth' through AD sync?", opts: ["It eliminates the need for enterprise owners", "It keeps user identities consistent across your organization", "It automatically writes code for developers", "It bypasses all GitHub billing"], ans: 1, exp: "Why use AD sync? Single source of truth: Keeps user identities consistent across your organization." },

  { cat: "Scripting", q: "As your enterprise scales, what becomes essential for maintainability?", opts: ["Manually managing every user", "Automating the management of permissions across multiple organizations", "Creating a new enterprise for every team", "Disabling default read access"], ans: 1, exp: "As your enterprise scales, automating the management of permissions across multiple organizations is essential for maintainability." },

  { cat: "Scripting", q: "Ultimately, what do these automation and scripting best practices help maintain as the enterprise grows?", opts: ["Strong governance", "Default Write permissions", "Decentralized billing", "Outside collaborator access"], ans: 0, exp: "...and maintain strong governance." }

const catColorMap = { 
  "Org Permissions":"cat-org-perms",
  "Enterprise Permissions":"cat-ent-perms",
  "Structure & Policies":"cat-structure",
  "Active Directory":"cat-ad-sync",
  "Scripting":"cat-scripting"
};

let answered = 0, correct = 0, currentFilter = 'all';

function renderAll() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  const filtered = currentFilter === 'all' ? questions : questions.filter(q => q.cat === currentFilter);
  filtered.forEach((q, idx) => {
    const globalIdx = questions.indexOf(q);
    container.appendChild(buildCard(q, globalIdx, idx + 1));
  });
}

function buildCard(q, globalIdx, displayNum) {
  const card = document.createElement('div');
  card.className = 'q-card';
  card.id = `q-${globalIdx}`;
  card.style.animationDelay = `${(displayNum - 1) * 0.03}s`;

  const catClass = catColorMap[q.cat] || 'cat-org-perms';
  const letters = ['A','B','C','D'];

  card.innerHTML = `
    <div class="q-header">
      <div class="q-num">${String(displayNum).padStart(2,'0')}</div>
      <div class="q-text">${q.q}</div>
      <span class="q-category ${catClass}">${q.cat}</span>
    </div>
    <div class="options" id="opts-${globalIdx}">
      ${q.opts.map((opt, i) => `
        <button class="option" onclick="selectAnswer(${globalIdx},${i})" id="opt-${globalIdx}-${i}">
          <span class="option-letter">${letters[i]}</span>
          <span>${opt}</span>
        </button>`).join('')}
    </div>
    <div class="answer-reveal" id="exp-${globalIdx}">
      <strong>✓ Answer: ${letters[q.ans]}. ${q.opts[q.ans]}</strong><br>${q.exp}
    </div>`;
  return card;
}

function selectAnswer(qIdx, selectedIdx) {
  const q = questions[qIdx];
  const optsDivButtons = document.querySelectorAll(`#opts-${qIdx} .option`);
  const expDiv = document.getElementById(`exp-${qIdx}`);
  if (expDiv.classList.contains('show')) return; // already answered

  answered++;
  const isCorrect = selectedIdx === q.ans;
  if (isCorrect) correct++;

  optsDivButtons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('correct');
    else if (i === selectedIdx && !isCorrect) btn.classList.add('wrong');
  });

  expDiv.classList.add('show');
  updateStats();
}

function updateStats() {
  document.getElementById('answered-count').textContent = answered;
  document.getElementById('correct-count').textContent = correct;
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-live').textContent = `${correct} / ${answered}`;
  document.getElementById('progress-fill').style.width = `${(answered / questions.length) * 100}%`;
}

function revealAll() {
  questions.forEach((q, idx) => {
    const expDiv = document.getElementById(`exp-${idx}`);
    if (!expDiv) return;
    const optsBtns = document.querySelectorAll(`#opts-${idx} .option`);
    optsBtns.forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.ans) btn.classList.add('correct');
    });
    expDiv.classList.add('show');
  });
}

function resetAll() {
  answered = 0; correct = 0;
  updateStats();
  renderAll();
}

function filterCat(cat, el) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderAll();
}

renderAll();
</script>
